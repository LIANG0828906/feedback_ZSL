<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>体积雾分块积分诊断工作台</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1020; --panel:#121a2e; --panel2:#18233b; --line:#2b3b5f; --text:#e8efff; --muted:#9db0d0; --ok:#46d39a; --warn:#ffcc66; --err:#ff7a90; --accent:#7aa2ff; }
    * { box-sizing: border-box; }
    body { margin:0; font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; background:linear-gradient(180deg,#0b1020,#0e1426 240px); color:var(--text); }
    header { padding:18px 24px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
    h1 { font-size:19px; margin:0 0 4px; }
    .sub { color:var(--muted); font-size:12px; }
    main { padding:18px 24px; display:grid; grid-template-columns: 360px 1fr; gap:16px; }
    .card { background:rgba(18,26,46,.92); border:1px solid var(--line); border-radius:14px; padding:14px; box-shadow:0 10px 30px rgba(0,0,0,.18); }
    .card h2 { font-size:14px; margin:0 0 12px; color:#fff; display:flex; align-items:center; gap:8px; }
    .grid { display:grid; gap:10px; }
    .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    label { display:grid; gap:4px; color:var(--muted); font-size:12px; }
    input,select,button,textarea { border-radius:9px; border:1px solid var(--line); background:#0d1528; color:var(--text); padding:8px 9px; font:inherit; }
    input { width:100%; }
    button { cursor:pointer; background:#203050; transition:.15s; }
    button:hover { border-color:var(--accent); transform:translateY(-1px); }
    button.primary { background:#3157c8; border-color:#4b74ef; }
    button.ok { background:#176447; border-color:#23966b; }
    button.warn { background:#6b4d16; border-color:#a67822; }
    button.danger { background:#6e2030; border-color:#b33b52; }
    .muted { color:var(--muted); }
    .okText { color:var(--ok); } .warnText { color:var(--warn); } .errText { color:var(--err); }
    table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; font-size:12px; }
    th,td { border-bottom:1px solid rgba(43,59,95,.7); padding:7px 6px; text-align:right; white-space:nowrap; }
    th:first-child,td:first-child,td.left,th.left { text-align:left; }
    th { color:var(--muted); position:sticky; top:0; background:var(--panel2); z-index:1; }
    .tableWrap { max-height:430px; overflow:auto; border:1px solid var(--line); border-radius:10px; }
    .pill { display:inline-flex; border:1px solid var(--line); border-radius:999px; padding:2px 8px; font-size:11px; color:var(--muted); }
    .pill.ok { color:var(--ok); border-color:rgba(70,211,154,.45); }
    .pill.err { color:var(--err); border-color:rgba(255,122,144,.45); }
    .pill.warn { color:var(--warn); border-color:rgba(255,204,102,.45); }
    pre { background:#080d1b; border:1px solid var(--line); border-radius:10px; padding:10px; overflow:auto; max-height:360px; font-size:11px; }
    .span2 { grid-column:1 / -1; }
    .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px; }
    .stat { background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:10px; }
    .stat b { display:block; font-size:18px; margin-top:2px; }
    .small { font-size:11px; }
    .btns { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
    .btns.three { grid-template-columns:1fr 1fr 1fr; }
    a { color:var(--accent); }
    @media (max-width: 1100px) { main { grid-template-columns:1fr; } .stats { grid-template-columns:repeat(2,1fr); } }
  </style>
</head>
<body>
<header>
  <div>
    <h1>透明介质体积雾 · 分块积分诊断工作台</h1>
    <div class="sub">确定性种子 <span id="seed">-</span> · 场景版本 <span id="sceneVersion">-</span> · 源工程哈希 <span id="sourceHash">-</span></div>
  </div>
  <div class="row">
    <span id="verifyPill" class="pill">尚未验证</span>
    <button onclick="loadSchema(currentSchema)">重新装载当前 Schema</button>
    <button class="warn" onclick="resetScene()">重置工作副本</button>
  </div>
</header>

<main>
  <section class="grid">
    <div class="card">
      <h2>1. 三版场景工程</h2>
      <div class="grid">
        <select id="schemaSelect" onchange="loadSchema(this.value)"></select>
        <div id="schemaLabels" class="grid small muted"></div>
        <div class="row">
          <a id="projectLink" href="/api/project" target="_blank">查看原始工程 JSON</a>
        </div>
        <button class="primary" onclick="compareVersions()">执行跨版本/三路径核算</button>
      </div>
    </div>

    <div class="card">
      <h2>2. 求解参数</h2>
      <div class="grid">
        <div class="row">
          <label style="flex:1">路径
            <select id="path">
              <option value="exact">exact 全块精确</option>
              <option value="preview">preview 稀疏预览</option>
              <option value="diagnostic">diagnostic 逐块诊断</option>
            </select>
          </label>
          <label style="width:90px">线程
            <input id="workers" type="number" value="4" min="1" max="64">
          </label>
          <label style="width:110px">缓冲/线程
            <input id="buffer" type="number" value="64" min="1" max="4096">
          </label>
        </div>
        <div class="row">
          <label style="flex:1">调度顺序
            <select id="order"><option value="forward">forward</option><option value="reverse">reverse</option></select>
          </label>
          <label style="width:110px">提交批次
            <input id="batchSize" type="number" value="0" min="0">
          </label>
        </div>
        <button class="ok" onclick="solve()">并行求解当前场景</button>
        <label>选择射线
          <select id="raySelect" onchange="renderRay()"></select>
        </label>
      </div>
    </div>

    <div class="card">
      <h2>3. 密度/系数/相机编辑</h2>
      <div class="grid">
        <div class="row">
          <label style="flex:1">介质
            <select id="editMedium"></select>
          </label>
          <label style="width:58px">X<input id="ex" type="number" value="2"></label>
          <label style="width:58px">Y<input id="ey" type="number" value="1"></label>
          <label style="width:58px">Z<input id="ez" type="number" value="1"></label>
          <label style="width:78px">新值<input id="ev" type="number" value="210"></label>
        </div>
        <button onclick="editVoxel()">应用体素编辑（增量）</button>
        <div class="row">
          <label style="flex:1">σa ‰<input id="ea" type="number" value="210"></label>
          <label style="flex:1">σs ‰<input id="es" type="number" value="820"></label>
          <label style="flex:1">g ‰<input id="eg" type="number" value="100"></label>
        </div>
        <button onclick="editCoeffs()">应用系数编辑</button>
        <div class="row">
          <label style="width:90px">相机<input id="ec" type="number" value="1" min="0"></label>
          <label style="flex:1">偏航 m°<input id="eyaw" type="number" value="12000"></label>
        </div>
        <button onclick="editCamera()">应用相机采样点编辑</button>
      </div>
    </div>

    <div class="card">
      <h2>4. 异常注入</h2>
      <div class="btns">
        <button class="danger" onclick="inject('density_out_of_range')">体素越界</button>
        <button class="danger" onclick="inject('density_shape_mismatch')">密度尺寸不符</button>
        <button class="danger" onclick="inject('negative_coefficient')">负衰减系数</button>
        <button class="danger" onclick="inject('distance_overflow')">距离换算溢出</button>
        <button class="warn" onclick="inject('unknown_schema')">未知 Schema</button>
        <button class="warn" onclick="inject('mixed_schema_combination')">混合版本组合</button>
        <button class="warn" onclick="inject('budget_workers')">越界线程预算</button>
        <button class="warn" onclick="inject('budget_buffer')">越界缓冲预算</button>
        <button class="warn" onclick="inject('backpressure')">缓冲耗尽背压</button>
        <button class="warn" onclick="inject('audit_tolerance_breach')">容差核算失败</button>
        <button class="danger" onclick="inject('truncated_checkpoint')">截断检查点</button>
        <button class="danger" onclick="inject('version_mismatch_checkpoint')">版本不匹配快照</button>
      </div>
    </div>

    <div class="card">
      <h2>5. SQLite 续算对照</h2>
      <div class="grid">
        <div class="small muted" id="cpPath"></div>
        <div class="btns three">
          <button class="danger" onclick="checkpoint('crash')">模拟强杀<br><span class="small">3 块后</span></button>
          <button class="warn" onclick="checkpoint('signal')">可处理信号<br><span class="small">2 射线</span></button>
          <button class="ok" onclick="checkpoint('resume')">版本匹配续算</button>
        </div>
        <button onclick="checkpoint('state')">读取检查点状态</button>
        <label class="row small"><input id="autoReset" type="checkbox" checked style="width:auto"> 版本不匹配时整段重算（不部分复用）</label>
      </div>
    </div>
  </section>

  <section class="grid">
    <div class="card span2">
      <h2>观测摘要</h2>
      <div class="stats" id="stats"></div>
      <div id="message" class="muted">正在生成确定性样本……</div>
    </div>

    <div class="card span2">
      <h2>逐射线分块结果 <span id="rayTitle" class="pill"></span></h2>
      <div class="tableWrap">
        <table id="blocksTable">
          <thead><tr>
            <th class="left">块</th><th>bin</th><th>区间 m</th><th>τa</th><th>τs</th><th>τ</th>
            <th>T入</th><th>T块</th><th>T出</th><th>能量</th><th>状态/缓存</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2>失效来源与传播闭包</h2>
      <pre id="invalidation">尚未施加编辑。</pre>
    </div>
    <div class="card">
      <h2>核算 / 注入 / 检查点输出</h2>
      <pre id="output">等待操作。所有计算均在本机进程内完成。</pre>
    </div>
  </section>
</main>

<script>
let boot = null, solveReport = null, currentSchema = null, lastIncremental = null;
const $ = id => document.getElementById(id);
const f6 = v => Number(v).toFixed(6);
const f3 = v => Number(v).toFixed(3);

async function api(path, body) {
  const opt = body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {};
  const res = await fetch(path, opt);
  const json = await res.json();
  if (!json.ok) { showError(json.error); throw json.error; }
  return json.data;
}
function showError(err) {
  if (!err) return;
  $('output').textContent = JSON.stringify(err, null, 2);
  setMessage(`${err.code}: ${err.message}`, 'errText');
}
function setMessage(text, cls='') { $('message').className = cls || 'muted'; $('message').textContent = text; }
function showJSON(id, data) { $(id).textContent = JSON.stringify(data, null, 2); }

async function init() {
  boot = await api('/api/bootstrap');
  $('seed').textContent = boot.seed;
  $('sceneVersion').textContent = boot.scene_version;
  $('sourceHash').textContent = boot.source_hash.slice(0,16) + '…';
  $('cpPath').textContent = boot.checkpoint_path;
  $('schemaSelect').innerHTML = boot.schemas.map(s => `<option value="${s.id}">${s.id}</option>`).join('');
  $('schemaLabels').innerHTML = boot.schemas.map(s => `<div><span class="pill">${s.id.split('+')[0]}</span> ${s.label}</div>`).join('');
  $('editMedium').innerHTML = boot.media.map(m => `<option value="${m.id}">${m.id} ${m.density.size.x}×${m.density.size.y}×${m.density.size.z}</option>`).join('');
  $('projectLink').href = '/api/project?schema=' + encodeURIComponent(boot.schemas[0].id);
  currentSchema = boot.schemas[0].id;
  $('schemaSelect').value = currentSchema;
  fillRays(boot.truth.rays);
  renderVerification(boot.verification);
  await solve();
}

function fillRays(rays) {
  $('raySelect').innerHTML = rays.map(r => `<option value="${r.ray_index}">${r.ray_id} · ${r.hit ? r.stop_reason + ' @' + r.terminal_block : '空结果 T=1'}</option>`).join('');
}

function renderVerification(v) {
  if (!v) return;
  $('verifyPill').className = 'pill ' + (v.ok ? 'ok' : 'err');
  $('verifyPill').textContent = v.ok ? '真值/三版本/三路径验收通过' : '存在核算偏差';
  $('stats').innerHTML = [
    ['射线', v.ray_count, `命中 ${v.hit_count}`],
    ['精确最大 T 误差', v.exact_max_t_error.toExponential(2), `τ ${v.exact_max_tau_error.toExponential(1)}`],
    ['预览最大误差', f6(v.preview_max_error), `界 ${f3(v.preview_bound)} · ${v.preview_within_bound ? 'PASS' : 'FAIL'}`],
    ['终止块匹配', `${v.terminal_matches}/${v.ray_count}`, v.diagnostic_replays ? '诊断可回放' : '诊断偏差']
  ].map(([k,b,s]) => `<div class="stat"><div class="muted small">${k}</div><b>${b}</b><div class="small muted">${s}</div></div>`).join('');
}

async function loadSchema(schema) {
  schema = typeof schema === 'string' ? schema : $('schemaSelect').value;
  try {
    const data = await api('/api/load', {schema});
    currentSchema = schema;
    lastIncremental = null;
    $('invalidation').textContent = '已重新装载 Schema；尚未施加编辑。';
    $('projectLink').href = '/api/project?schema=' + encodeURIComponent(schema);
    setMessage(`已装载 ${schema}；内部场景版本 ${data.scene_version}；等价=${data.equivalent_to_canonical}`, 'okText');
    await solve();
  } catch (e) {}
}

function opts() {
  return {
    path: $('path').value, workers: +$('workers').value, buffer: +$('buffer').value,
    order: $('order').value, batch_size: +$('batchSize').value
  };
}

async function solve() {
  try {
    solveReport = await api('/api/solve', opts());
    if (!lastIncremental) fillRays(solveReport.rays);
    renderRay();
    setMessage(`求解完成：${solveReport.rays.length} 条射线，调度 ${solveReport.budget.workers}×${solveReport.budget.per_worker_buffer}，顺序 ${solveReport.order}`, 'okText');
  } catch(e) {}
}

function currentRay() {
  const idx = +$('raySelect').value || 0;
  return solveReport?.rays?.[idx];
}

function renderRay() {
  const r = currentRay();
  const tb = document.querySelector('#blocksTable tbody');
  if (!r) { tb.innerHTML=''; return; }
  $('rayTitle').textContent = `${r.ray_id} · T=${f6(r.transmittance)} · ${r.stop_reason} @${r.terminal_block} · ${r.duration_ns}ns`;
  if (!r.hit) {
    tb.innerHTML = `<tr><td class="left">无介质相交：确定性空结果</td><td colspan="10">Transmittance=1，Blocks=[]，TerminalBlock=-1；耗时 ${r.duration_ns}ns 仅作诊断</td></tr>`;
    return;
  }
  tb.innerHTML = r.blocks.map(b => `<tr>
    <td class="left">#${b.block_index}${b.terminal ? ' <span class="pill warn">终止</span>' : ''}</td>
    <td>${b.chunk_bin}</td><td>${f3(b.t0)}–${f3(b.t1)}</td>
    <td>${f6(b.tau_a)}</td><td>${f6(b.tau_s)}</td><td>${f6(b.tau)}</td>
    <td>${f6(b.t_in)}</td><td>${f6(b.t_block)}</td><td>${f6(b.t_out)}</td><td>${b.energy.toExponential(4)}</td>
    <td class="left">${b.cache_status || (b.preview_sampled ? 'preview-sample' : '')} ${(b.invalidation_sources||[]).length ? '<span class="pill warn">失效传播</span>' : ''}</td>
  </tr>`).join('');
}

async function compareVersions() {
  try {
    const data = await api('/api/compare');
    showJSON('output', data);
    const c = data.cross_version;
    setMessage(`跨版本 DeepEqual=${c.deep_equal}，最大 τ Q差=${c.max_tau_diff_q}，最大 T Q差=${c.max_t_diff_q}`, c.deep_equal ? 'okText' : 'errText');
  } catch(e) {}
}

async function edit(body) {
  try {
    const data = await api('/api/edit', body);
    lastIncremental = data.result;
    solveReport = data.result.report;
    fillRays(solveReport.rays);
    renderRay();
    showJSON('invalidation', data.result.invalidation);
    showJSON('output', {diff:data.result.diff, full_check:data.result.full_check, source_hash:data.source_hash});
    setMessage(`增量完成：变更射线 ${data.result.diff.changed_rays.length}，变更块 ${data.result.diff.changed_blocks.length}，全量一致性=${data.result.full_check.ok}`, data.result.full_check.ok ? 'okText' : 'errText');
  } catch(e) {}
}
function editVoxel() { edit({kind:'voxel', medium_id:$('editMedium').value, x:+$('ex').value,y:+$('ey').value,z:+$('ez').value,value:+$('ev').value}); }
function editCoeffs() { edit({kind:'coefficients', medium_id:$('editMedium').value, sigma_a_permille:+$('ea').value, sigma_s_permille:+$('es').value, anisotropy_permille:+$('eg').value}); }
function editCamera() { edit({kind:'camera', camera_index:+$('ec').value, yaw_milli_deg:+$('eyaw').value}); }
async function resetScene() {
  await api('/api/reset', {});
  lastIncremental = null;
  $('invalidation').textContent = '尚未施加编辑。';
  await init();
}

async function inject(kind) {
  try {
    const data = await api('/api/inject', {kind});
    showJSON('output', data);
    setMessage(`注入 ${kind} 未返回预期错误`, 'warnText');
  } catch (e) {
    const existing = boot?.verification?.ray_count;
    $('output').textContent = JSON.stringify({injected:kind, stable_code:e.code, path:e.path, message:e.message, context:e.context, source_hash:boot.source_hash, existing_committed_ray_results:existing, active_results_remain_available:!!solveReport}, null, 2);
    setMessage(`已注入并捕获 ${e.code}：${e.path || ''}`, 'errText');
  }
}

async function checkpoint(action) {
  try {
    const data = await api('/api/checkpoint', {action, auto_reset:$('autoReset').checked});
    showJSON('output', data);
    setMessage(`检查点操作 ${action} 完成`, 'okText');
  } catch(e) {}
}

init().catch(e => { showError(e); setMessage('初始化失败：' + e, 'errText'); });
</script>
</body>
</html>
