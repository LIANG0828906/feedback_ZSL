[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dome-render"
version = "1.0.0"
description = "Deterministic offline soft rasterizer for layered theatre-dome scenes"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
dome-render = "dome_render.cli:main"
