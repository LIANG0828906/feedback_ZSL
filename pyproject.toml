[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vpipe"
version = "0.1.0"
description = "Deterministic vector-path boolean pipeline for desktop UI assets"
requires-python = ">=3.11"
dependencies = [
    "PySide6==6.8.2.1",
    "numpy==2.2.3",
]

[tool.setuptools.packages.find]
include = ["vpipe*"]

