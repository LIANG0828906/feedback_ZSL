[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "game-voice-loudness-archive"
version = "1.0.0"
description = "Deterministic game-voice loudness metadata archive workbench"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
loudness-archive = "loudness_archive.cli:main"

[tool.setuptools.packages.find]
include = ["loudness_archive*"]

