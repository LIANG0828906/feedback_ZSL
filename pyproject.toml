[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen-filter-studio"
version = "0.1.0"
description = "Deterministic, incremental multi-stage image filtering workbench"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "Pillow>=10.0",
    "PySide6>=6.7",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
filter-studio = "filter_studio.ui.main:main"
filter-studio-verify = "filter_studio.acceptance:main"

[tool.setuptools.packages.find]
include = ["filter_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
