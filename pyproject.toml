[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-acoustic-workbench"
version = "1.0.0"
description = "Deterministic spatial acoustic analysis, reconstruction and verification workbench"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "PySide6>=6.6",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
spatial-workbench = "spatial_workbench.cli:main"

[tool.setuptools.packages.find]
include = ["spatial_workbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

