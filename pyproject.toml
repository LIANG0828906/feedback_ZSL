[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mixrec"
version = "1.0.0"
description = "Deterministic local multi-track mixing and slice recording workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
test = ["pytest>=8.0"]

[project.scripts]
mixrec = "mixrec.cli:main"

[tool.setuptools.packages.find]
include = ["mixrec*"]
