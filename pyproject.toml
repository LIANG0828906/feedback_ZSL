[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rosewin"
version = "1.0.0"
description = "Offline deterministic software rasterizer for a Gothic rose window validation pipeline."
requires-python = ">=3.11"
dependencies = ["numpy==1.26.4", "Pillow==10.2.0"]

[tool.setuptools.packages.find]
where = ["src"]
