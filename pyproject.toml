[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tickarena"
version = "1.0.0"
description = "Deterministic tick-based arena rules engine with replay verification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "TickArena Team" }]
dependencies = []

[project.optional-dependencies]
dev = ["numpy>=1.24"]

[project.scripts]
tickarena-generate = "tickarena.generate_cli:main"
tickarena-verify = "tickarena.verify_cli:main"

[tool.setuptools]
packages = ["tickarena"]

