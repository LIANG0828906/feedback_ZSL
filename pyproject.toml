[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studio-calibration-workbench"
version = "0.1.0"
description = "Deterministic multichannel acoustic calibration workbench"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "PySide6>=6.8",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
studio-calib = "studio_calib.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

