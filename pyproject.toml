[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loudbench"
version = "1.0.0"
description = "面向游戏与互动媒体音频素材的广播响度与动态范围处理工作台"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.1.3",
    "scipy==1.14.1",
    "PySide6==6.8.1",
]

[project.scripts]
loudbench = "loudbench.cli.main:main"
loudbench-gui = "loudbench.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
