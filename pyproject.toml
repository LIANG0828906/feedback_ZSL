[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mocap-constraint-workbench"
version = "1.0.0"
description = "Deterministic BVH constraint solving workbench with snapshots and PyQt/OpenGL UI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
gui = [
  "PyQt5>=5.15",
  "PyOpenGL>=3.1",
]
test = [
  "pytest>=8",
]

[project.scripts]
mocap-workbench = "mocap_workbench.cli:main"

[tool.setuptools.packages.find]
include = ["mocap_workbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

