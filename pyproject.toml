[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incremental-surface-viewer"
version = "0.1.0"
description = "Deterministic dependency-aware incremental surface product pipeline"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "PyOpenGL>=3.1.7",
    "PyOpenGL-accelerate>=3.1.7",
]

[project.scripts]
surface-viewer = "surface_viewer.cli:main"

[tool.setuptools.packages.find]
include = ["surface_viewer*"]
