[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wuchang-master"
version = "0.1.0"
description = "Deterministic offline Peking opera percussion bus renderer"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "soundfile>=0.12",
]

[project.scripts]
wuchang = "wuchang.cli:main"

[tool.setuptools.packages.find]
include = ["wuchang*"]

