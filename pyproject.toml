[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "score-expression-engine"
version = "0.1.0"
description = "Deterministic digital score parsing and performance-expression engine"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "PySide6>=6.8",
]

[project.scripts]
score-engine = "score_engine.cli:main"

[tool.setuptools.packages.find]
include = ["score_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

