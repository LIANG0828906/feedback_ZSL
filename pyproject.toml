[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bamboo-lampshade-verifier"
version = "1.0.0"
description = "Deterministic offline software renderer for a three-layer woven bamboo lampshade"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
]

[project.scripts]
bamboo-render = "bamboo_render.cli:main"

[tool.setuptools.packages.find]
include = ["bamboo_render*"]
