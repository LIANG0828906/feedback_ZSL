[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vp-composite-pipeline"
version = "1.0.0"
description = "Deterministic multi-version virtual-production compositing and verification pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "PySide6>=6.8,<7",
]

[project.scripts]
vp-pipeline = "vp_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["vp_pipeline*"]
