[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tactical-pick-workbench"
version = "1.0.0"
description = "Deterministic tactical battlefield picking, placement and trace replay"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gui = ["PyQt5>=5.15"]
numeric = ["numpy>=2.0"]

[project.scripts]
tactical-pick = "tactical_pick.cli:main"

[tool.setuptools.packages.find]
include = ["tactical_pick*"]
