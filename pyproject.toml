[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh-repair"
version = "0.1.0"
description = "Budgeted, chunked triangular mesh repair for asset ingestion"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
gl = ["PyOpenGL>=3.1", "pygame-ce>=2.5"]
test = ["pytest>=8"]

[project.scripts]
mesh-repair = "mesh_repair.cli:main"

[tool.setuptools.packages.find]
include = ["mesh_repair*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
