[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "applause-master"
version = "1.0.0"
description = "Deterministic multi-mic applause event detection and stereo master rendering"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "soundfile"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
applause-master = "applause_master.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
