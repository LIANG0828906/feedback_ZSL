[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glass-verify"
version = "1.0.0"
description = "Deterministic offline validation renderer for stained-glass scenes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "Pillow>=9.0",
]

[project.scripts]
glass-verify = "glass_verify.cli:main"

[tool.setuptools.packages.find]
include = ["glass_verify*"]
