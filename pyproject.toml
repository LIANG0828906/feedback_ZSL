[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tileforge"
version = "1.0.0"
description = "Deterministic tiled HDR conversion, versioning and recovery workbench"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ui = ["PySide6>=6.6,<7"]
scientific = ["numpy>=1.26,<3"]

[project.scripts]
tileforge = "tileforge.cli:main"

[tool.setuptools.packages.find]
include = ["tileforge*"]
