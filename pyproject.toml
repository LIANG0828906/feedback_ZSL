[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-lantern-validator"
version = "1.0.0"
description = "Deterministic offline soft-raster paper-lantern validation renderer"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
paper-lantern = "paper_lantern.cli:main"

[tool.setuptools.packages.find]
include = ["paper_lantern*"]

