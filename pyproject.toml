[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "volverify"
version = "1.0.0"
description = "Deterministic offline volume-rendering verification component"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
]

[project.scripts]
volverify = "volverify.cli:main"

[tool.setuptools.packages.find]
include = ["volverify*"]

