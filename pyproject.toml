[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veil-render"
version = "1.0.0"
description = "Deterministic offline validation renderer for layered gauze and metal lattice scenes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
]

[project.scripts]
veil-render = "veilrender.cli:main"

[tool.setuptools]
packages = ["veilrender"]

