[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "live-transcode-sim"
version = "1.0.0"
description = "Deterministic local multi-track slicing and ABR switch simulator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["PySide6>=6.6"]

[project.scripts]
livetranscode = "livetranscode.cli:main"

[tool.setuptools.packages.find]
include = ["livetranscode*"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
ignore = ["BLE001", "PLW1510"]

