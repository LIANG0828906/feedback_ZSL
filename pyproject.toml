[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openworld-terrain-pipeline"
version = "0.1.0"
description = "Deterministic open-world terrain bake, invalidation, and snapshot pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
ui = [
    "PyQt5>=5.15.9",
    "moderngl>=5.8.2",
]
test = [
    "pytest>=7.4",
]

[project.scripts]
terrain-pipeline = "terrain_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["terrain_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["BLE001", "PYI034"]

