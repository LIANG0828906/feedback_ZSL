[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcwb"
version = "0.1.0"
description = "Deterministic point-cloud editing workbench with atomic versioning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "PyOpenGL>=3.1.7",
]

[project.optional-dependencies]
glfw = ["glfw>=2.6"]
test = ["pytest>=8"]

[project.scripts]
pcwb = "pcwb.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
