[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "levelworkbench"
version = "1.0.0"
description = "Deterministic offline level generation and diagnosis workbench"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pyside6>=6.8",
]

[project.scripts]
levelworkbench = "levelworkbench.cli:main"

[tool.setuptools.packages.find]
include = ["levelworkbench*"]
