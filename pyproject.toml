[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "choir-master"
version = "1.0.0"
description = "Deterministic offline choir mastering and resumable rendering"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "soundfile>=0.12",
]

[project.scripts]
choir-master = "choir_master.cli:main"

[tool.setuptools.packages.find]
include = ["choir_master*"]

