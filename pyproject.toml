[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-subtitle-layout"
version = "1.0.0"
description = "Deterministic local subtitle layout, accessible-description insertion and recovery workbench"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "PySide6>=6.6",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
subtitle-localizer = "subtitle_localizer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

