[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "recommendation-gateway"
version = "1.0.0"
description = "Contract-safe recommendation inference gateway for v3 to v4 migration"
requires-python = ">=3.11,<3.13"
dependencies = [
  "onnxruntime==1.18.1",
  "fastapi==0.115.6",
  "uvicorn==0.34.0",
  "httpx==0.27.2",
  "prometheus-client==0.21.1",
  "numpy==1.26.4",
]

[project.optional-dependencies]
test = ["pytest==8.3.4"]

[project.scripts]
rec-gateway = "rec_gateway.__main__:main"

[tool.setuptools.packages.find]
include = ["rec_gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
