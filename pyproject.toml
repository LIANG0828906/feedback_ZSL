[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gallery-louvers"
version = "1.0.0"
description = "Deterministic off-screen renderer for a perforated cast-aluminium gallery facade"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy==1.26.4"]

[project.scripts]
gallery-louvers = "gallery_louvers.cli:main"

[tool.setuptools.packages.find]
include = ["gallery_louvers*"]
