[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inverse-render"
version = "1.0.0"
description = "Deterministic, differentiable local scene fitting with reusable dependency-aware gradients"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "torch>=2.4,<2.8",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
inverse-render = "inverse_render.cli:main"

[tool.setuptools.packages.find]
include = ["inverse_render*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

