[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dustrender"
version = "1.0.0"
description = "Deterministic offline volumetric dust and glass preview renderer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "PyOpenGL>=3.1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dustrender = "dustrender.cli:main"

[tool.setuptools.packages.find]
include = ["dustrender*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
