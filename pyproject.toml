[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rainforest-master"
version = "0.1.0"
description = "Deterministic, loop-safe rainforest ambience mastering pipeline"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "soundfile>=0.12",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
rainforest-master = "rainforest_master.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

