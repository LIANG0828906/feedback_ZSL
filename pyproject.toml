[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "formation-workbench"
version = "0.1.0"
description = "Formation path planning, tick replay and incremental diagnostics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "PySide6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
formation-workbench = "formation_workbench.__main__:main"

[tool.setuptools.packages.find]
include = ["formation_workbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
