[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordersync-consistency"
version = "1.0.0"
description = "Read/write consistency service for SQL Server primary/replica order workloads"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
sqlserver = ["pyodbc>=5,<6"]
test = ["pytest>=8,<9"]

[project.scripts]
ordersync = "ordersync.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

