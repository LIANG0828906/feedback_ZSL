[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cover-replay"
version = "0.1.0"
description = "Deterministic fixed-step tactical cover replay and settlement verifier"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
gui = ["PySide6>=6,<7"]
test = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
cover-replay = "cover_replay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

