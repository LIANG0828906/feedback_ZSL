[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "volrender-numpy"
version = "0.1.0"
description = "Deterministic NumPy volume renderer with observable error propagation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "PyQt5>=5.15",
]

[project.optional-dependencies]
dev = []

[project.scripts]
volrender-render = "volrender.render_demo:main"
volrender-gui = "volrender.app:main"

[tool.setuptools.packages.find]
include = ["volrender*"]
