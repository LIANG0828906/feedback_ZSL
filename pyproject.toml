[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "live-transcode-lab"
version = "0.1.0"
description = "Deterministic multichannel WAV transcode slicing, sidecar, recovery and review UI"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.2.6",
  "PySide6==6.8.3",
]

[project.scripts]
live-transcode = "live_transcode.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

