[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transparent-volume-pipeline"
version = "1.0.0"
description = "Deterministic transparent media and volumetric light processing pipeline"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "PyOpenGL>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
tvol = "transparent_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

