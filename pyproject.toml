[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haptic-event-kernel"
version = "1.0.0"
description = "Deterministic haptic event scheduling kernel and diagnostic workbench"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<2",
    "PySide6>=6.6,<6.7",
]

[project.scripts]
haptic-kernel = "haptics.cli:main"
haptic-workbench = "haptics.workbench.app:main"

[tool.setuptools.packages.find]
include = ["haptics*"]

