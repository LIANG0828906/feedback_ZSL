[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imq-workbench"
version = "1.0.0"
description = "Deterministic block-DCT image compression quality workbench"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.3.4",
  "PySide6==6.9.3",
]

[project.scripts]
imq-workbench = "imq_workbench.cli:main"

[tool.setuptools.packages.find]
include = ["imq_workbench*"]
