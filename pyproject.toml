[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "artmask-workbench"
version = "1.0.0"
description = "Deterministic image segmentation and mask diagnostics workbench"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "PyQt5>=5.15,<6",
]

[project.scripts]
artmask = "artmask.cli:main"
artmask-gui = "artmask.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]
