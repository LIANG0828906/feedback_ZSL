[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tactical-cover-review"
version = "0.1.0"
description = "Deterministic tactical-cover replay and reconciliation workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "PySide6>=6.6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cover-review = "tactical_review.cli:main"

[tool.setuptools.packages.find]
include = ["tactical_review*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"tactical_review/runner.py" = ["BLE001"]

