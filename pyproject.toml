[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "padweave-studio"
version = "1.0.0"
description = "Deterministic cross-platform gamepad mapping laboratory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "PySide6>=6.8",
]

[project.optional-dependencies]
dev = []

[project.scripts]
padweave = "gamepad_studio.cli:main"
padweave-gui = "gamepad_studio.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

