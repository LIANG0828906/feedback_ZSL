[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aquarium-render"
version = "1.0.0"
description = "Deterministic offscreen renderer for a layered glass aquarium"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
aquarium-render = "aquarium_render.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

