[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mcsync-workbench"
version = "1.0.0"
description = "Deterministic multi-channel clock-drift synchronization workbench"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
test = ["pytest>=8"]

[project.scripts]
mcsync = "mcsync.cli:main"

[tool.setuptools.packages.find]
include = ["mcsync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

