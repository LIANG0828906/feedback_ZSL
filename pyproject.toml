[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-music-repair"
version = "1.0.0"
description = "Deterministic block-based voice and music repair desktop application"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "PySide6>=6.6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
voice-repair = "repair_app.cli:main"

[tool.setuptools.packages.find]
include = ["repair_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

