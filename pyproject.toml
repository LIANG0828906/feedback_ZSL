[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowbox-validator"
version = "1.0.0"
description = "Deterministic offline software renderer for layered paper screen lightboxes"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "Pillow>=10.0"]

[project.scripts]
shadowbox = "shadowbox.cli:main"

[tool.setuptools.packages.find]
include = ["shadowbox*"]
