[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orderlab-gateway"
version = "0.1.0"
description = "Read-only, dialect-normalizing SQL Server order query gateway"
requires-python = ">=3.11,<3.15"
dependencies = ["pyodbc>=5.1,<6"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
orderlab-gateway = "orderlab_gateway.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: requires a reachable SQL Server and initialized test database",
]
