[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "battle-balance-lab"
version = "1.0.0"
description = "Deterministic fixed-point combat balance validation workbench"
requires-python = ">=3.11,<3.15"
dependencies = [
  "numpy>=2.0",
  "PySide6>=6.8",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["balance_lab*"]

