[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "venue-crosstalk"
version = "1.0.0"
description = "Deterministic venue loudspeaker crosstalk analysis workbench"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
gui = ["PyQt5>=5.15"]

[project.scripts]
venue-crosstalk = "venue_crosstalk.cli:main"

[tool.setuptools.packages.find]
include = ["venue_crosstalk*"]
