[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "spectraforge"
version = "1.0.0"
description = "Multispectral HDR image composition workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "PySide6>=6.7",
]

[project.scripts]
spectraforge = "spectraforge.cli:main"

[tool.setuptools.packages.find]
include = ["spectraforge*"]
