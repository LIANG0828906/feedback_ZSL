[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "streamforge"
version = "1.0.0"
description = "Deterministic local multi-bitrate slicing and playback simulation service"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==2.4.6",
    "PySide6==6.12.0",
]

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[project.scripts]
streamforge = "streamforge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
