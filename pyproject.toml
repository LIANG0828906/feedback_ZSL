[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sciseq"
version = "1.0.0"
description = "Deterministic scientific imaging sequence processing components"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.5",
  "PySide6>=6.12",
]

[project.optional-dependencies]
test = ["pytest>=9"]

[project.scripts]
sciseq = "sciseq.cli:main"
sciseq-gui = "sciseq.gui.app:main"

[tool.setuptools.packages.find]
include = ["sciseq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

