[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motionreview"
version = "0.1.0"
description = "Deterministic desktop BVH constraint review workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.scripts]
motionreview = "motionreview.cli:main"

[tool.setuptools.packages.find]
include = ["motionreview*"]
