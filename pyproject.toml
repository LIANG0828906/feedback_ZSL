[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "volrender"
version = "1.0.0"
description = "Deterministic budgeted volume ray casting with SVOL validation and snapshots"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
]

[project.optional-dependencies]
gui = [
  "PySide6>=6.7",
  "PyOpenGL>=3.1",
]
test = [
  "pytest>=8",
]

[project.scripts]
volrender-demo = "scripts.run_demo:main"

[tool.setuptools.packages.find]
include = ["volrender*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

