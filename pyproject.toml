[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgepipe"
version = "1.0.0"
description = "Deterministic chunked edge detection and morphology pipeline with resumable checkpoints"
requires-python = ">=3.10,<3.12"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "PyQt5>=5.15",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
edgepipe = "edgepipe.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

