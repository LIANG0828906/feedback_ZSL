[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hdr-delivery-studio"
version = "1.0.0"
description = "Deterministic HDR/SDR conversion, versioning, recovery, and desktop workbench"
requires-python = ">=3.11,<3.15"
dependencies = [
  "numpy==2.4.6",
  "PySide6==6.12.0",
]

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[project.scripts]
hdr-studio = "hdr_studio.cli:main"

[tool.setuptools.packages.find]
include = ["hdr_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

