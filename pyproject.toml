[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "festival-master"
version = "1.0.0"
description = "Deterministic offline festival documentary stereo mastering renderer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.scripts]
festival-master = "festival_master.cli:main"

[tool.setuptools.packages.find]
include = ["festival_master*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
