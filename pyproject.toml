[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "space-audio-renderer"
version = "1.0.0"
description = "Deterministic offline spatial soundscape renderer (occlusion, dynamic reverb, binaural)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[tool.setuptools]
packages = ["space_audio"]

