[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studio-calibrator"
version = "1.0.0"
description = "Deterministic multichannel studio crosstalk calibration workbench"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy==2.3.5",
  "scipy==1.16.3",
  "PyQt5==5.15.11",
  "soundfile==0.13.1",
]

[project.optional-dependencies]
test = ["pytest==9.0.1"]

[project.scripts]
studio-calibrator = "studio_calibrator.cli:main"

[tool.setuptools.packages.find]
include = ["studio_calibrator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore:.*sipPyTypeDict.*:DeprecationWarning",
]

