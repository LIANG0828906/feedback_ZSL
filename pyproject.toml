[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tactical-pick-debug"
version = "1.0.0"
description = "Deterministic local debug pipeline for turn-based tactical picking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.scripts]
tactical-debug = "tactical_pick.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

