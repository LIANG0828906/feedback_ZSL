[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audiobook-master"
version = "1.0.0"
description = "Deterministic, resumable offline audiobook loudness mastering"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy==1.26.4"]

[project.scripts]
audiobook-master = "audiobook_master.cli:main"

[tool.setuptools.packages.find]
include = ["audiobook_master*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
