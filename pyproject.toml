[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestral-mastering"
version = "1.0.0"
description = "Deterministic offline orchestral stem alignment, unmasking and mastering"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
orchestral-master = "orchestral_mastering.cli:main"

[tool.setuptools.packages.find]
include = ["orchestral_mastering*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

