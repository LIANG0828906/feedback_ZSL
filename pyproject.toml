[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "order-events-coordinator"
version = "1.0.0"
description = "Partition-exclusive Kafka order-events consumer-group coordinator"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ordergroup = "ordergroup.cli:main"

[tool.setuptools.packages.find]
include = ["ordergroup*"]

