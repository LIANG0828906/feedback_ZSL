[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haptic-studio"
version = "0.1.0"
description = "Deterministic, versioned haptic waveform preview studio"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
test = ["pytest>=8"]

[project.scripts]
haptic-studio = "haptic_studio.cli:main"

[tool.setuptools.packages.find]
include = ["haptic_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

