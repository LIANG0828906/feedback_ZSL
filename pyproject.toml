[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diffrender-reverse"
version = "1.0.0"
description = "Deterministic differentiable ray casting and inverse rendering toolkit"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.0",
  "matplotlib>=3.7",
]

[project.scripts]
diffrender = "diffrender.cli:main"

[tool.setuptools.packages.find]
include = ["diffrender*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

