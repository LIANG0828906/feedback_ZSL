[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motion-workbench"
version = "1.0.0"
description = "Deterministic incremental BVH constraint solving workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy==1.26.4",
  "PySide6==6.7.2",
]

[project.scripts]
motion-workbench = "motion_workbench.cli:main"
motion-workbench-gui = "motion_workbench.gui:main"

[tool.setuptools.packages.find]
include = ["motion_workbench*"]
