[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terrainviz"
version = "0.1.0"
description = "Deterministic CPU terrain LOD, seam repair, and offscreen rendering"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.scripts]
terrainviz = "terrainviz.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

