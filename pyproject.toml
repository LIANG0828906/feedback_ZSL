[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorbool"
version = "0.1.0"
description = "Deterministic tolerant vector path boolean operations and previews"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "PySide6>=6.7",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
vectorbool = "vectorbool.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

