[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serene-render"
version = "1.0.0"
description = "Deterministic offline soft-raster renderer for layered lattice doors"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
]

[project.scripts]
serene-render = "serene_render.cli:main"

[tool.setuptools.packages.find]
include = ["serene_render*"]
