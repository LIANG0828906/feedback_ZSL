[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "celadon-museum-preview"
version = "1.0.0"
description = "Deterministic offline soft rasterizer for a stacked celadon museum preview"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pillow>=10.0",
]

[project.scripts]
celadon-museum = "celadon_museum.cli:main"

[tool.setuptools.packages.find]
include = ["celadon_museum*"]
