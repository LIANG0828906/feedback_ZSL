<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>掩码质检本地诊断台</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, "Noto Sans SC", system-ui, sans-serif; }
    body { margin: 0; background: #0f172a; color: #e2e8f0; }
    header { padding: 18px 24px; background: #111827; border-bottom: 1px solid #334155; }
    h1 { margin: 0 0 6px; font-size: 20px; }
    main { padding: 20px 24px; display: grid; grid-template-columns: 340px 1fr; gap: 18px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    label { display: block; font-size: 13px; color: #cbd5e1; margin: 10px 0 4px; }
    select, input, button { width: 100%; box-sizing: border-box; border-radius: 8px; border: 1px solid #475569; padding: 8px 10px; background: #0f172a; color: #e2e8f0; }
    button { cursor: pointer; background: #2563eb; border-color: #3b82f6; font-weight: 650; margin-top: 12px; }
    button.secondary { background: #334155; border-color: #64748b; }
    button.good { background: #047857; border-color: #10b981; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .images { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .images figure { margin: 0; background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 8px; text-align: center; font-size: 12px; }
    .images img { width: 100%; image-rendering: pixelated; background: repeating-conic-gradient(#1f2937 0% 25%, #111827 0% 50%) 50% / 16px 16px; border-radius: 6px; }
    pre { white-space: pre-wrap; word-break: break-word; max-height: 360px; overflow: auto; background: #020617; padding: 12px; border-radius: 8px; border: 1px solid #1e293b; font-size: 12px; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #065f46; color: #d1fae5; font-size: 12px; margin-left: 8px; }
    .pill.bad { background: #7f1d1d; color: #fee2e2; }
    .muted { color: #94a3b8; font-size: 12px; line-height: 1.5; }
  </style>
</head>
<body>
<header>
  <h1>掩码质检本地诊断台 <span id="statusPill" class="pill">确定性种子 / SQLite</span></h1>
  <div class="muted">三 schema 装载、笔画覆盖、拓扑核验、精确失效、崩溃恢复与三路径像素比对均在本机完成。</div>
</header>
<main>
  <section>
    <div class="card">
      <label for="batch">样本批次</label>
      <select id="batch"></select>
      <button class="secondary" id="resetBtn">重置该批次</button>
    </div>
    <div class="card">
      <strong>模拟编辑</strong>
      <label for="seq">笔序号</label>
      <select id="seq"></select>
      <label for="kind">编辑类型</label>
      <select id="kind">
        <option value="weight">覆盖权重（permille 0..1000）</option>
        <option value="priority">工序优先级（越小越先）</option>
        <option value="hardness">笔刷硬度（permille 0..1000）</option>
        <option value="radius">半径刻度（1..16）</option>
        <option value="move_start">移动起点</option>
        <option value="move_end">移动终点</option>
      </select>
      <label for="value">数值</label>
      <input id="value" type="number" value="900" />
      <div class="row">
        <div><label for="x">X（坐标编辑）</label><input id="x" type="number" value="24" /></div>
        <div><label for="y">Y</label><input id="y" type="number" value="68" /></div>
      </div>
      <button id="applyBtn">应用并增量核验</button>
      <button class="good" id="equivBtn">三路径一致性比对</button>
    </div>
    <div class="card">
      <strong>Schema 导出/读回</strong>
      <div class="row">
        <button class="secondary" data-schema="icon.project/v1">导出 v1</button>
        <button class="secondary" data-schema="icon.project/v2">导出 v2</button>
      </div>
      <button class="secondary" data-schema="icon.project/v3">导出 v3</button>
    </div>
  </section>

  <section>
    <div class="card">
      <strong>像素视图</strong>
      <div class="images">
        <figure><img id="img-image" alt="icon"/><figcaption>生成图标</figcaption></figure>
        <figure><img id="img-candidate" alt="candidate"/><figcaption>候选掩码（内缩/外溢/空洞）</figcaption></figure>
        <figure><img id="img-mask" alt="accumulated"/><figcaption>积算掩码</figcaption></figure>
        <figure><img id="img-truth" alt="truth"/><figcaption>解析真值掩码</figcaption></figure>
      </div>
    </div>
    <div class="card">
      <strong>失效清单与拓扑</strong>
      <pre id="invalidation">等待操作…</pre>
    </div>
    <div class="card">
      <strong>三路径 / SQLite 恢复</strong>
      <pre id="equivalence">点击“三路径一致性比对”。</pre>
    </div>
    <div class="card">
      <strong>Schema 转换痕迹与 E_LOSSY</strong>
      <pre id="schema">选择导出版本。</pre>
    </div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let samples = [];
function batch() { return $('batch').value || 0; }
function bust(kind) { return `/image?batch=${batch()}&kind=${kind}&t=${Date.now()}`; }
function refreshImages() {
  ['image','candidate','mask','truth'].forEach(k => $(`img-${k}`).src = bust(k));
}
async function json(url, options) {
  const res = await fetch(url, options);
  const data = await res.json();
  if (!res.ok) throw data;
  return data;
}
function showError(el, err) {
  el.textContent = JSON.stringify(err, null, 2);
}
async function loadSamples() {
  samples = await json('/api/samples');
  $('batch').innerHTML = samples.map((s,i) => `<option value="${i}">${s.id} / seed ${s.seed}</option>`).join('');
  $('seq').innerHTML = samples[0].strokes.map(s => `<option value="${s.seq}">#${s.seq} priority=${s.order_priority} w=${s.weight_permille}</option>`).join('');
  refreshImages();
}
$('batch').onchange = () => {
  const s = samples[batch()];
  $('seq').innerHTML = s.strokes.map(x => `<option value="${x.seq}">#${x.seq} priority=${x.order_priority} w=${x.weight_permille}</option>`).join('');
  refreshImages();
  $('invalidation').textContent = '已切换批次。';
};
$('kind').onchange = () => {
  const k = $('kind').value;
  $('value').disabled = k.startsWith('move');
  $('x').disabled = !k.startsWith('move');
  $('y').disabled = !k.startsWith('move');
};
$('applyBtn').onclick = async () => {
  const params = new URLSearchParams({batch: batch(), seq: $('seq').value, kind: $('kind').value, value: $('value').value, x: $('x').value, y: $('y').value});
  try {
    const data = await json('/api/edit?' + params.toString());
    const r = data.result;
    $('invalidation').textContent = JSON.stringify({
      topology_error: data.topology_error || r.pipeline?.topology_error,
      invalidation: r.invalidation,
      persistent_hits: r.persistent_hits,
      topology: r.pipeline?.topology
    }, null, 2);
    refreshImages();
  } catch (e) { showError($('invalidation'), e); }
};
$('resetBtn').onclick = async () => {
  try { await json(`/api/reset?batch=${batch()}`); $('invalidation').textContent = '已重置。'; refreshImages(); }
  catch (e) { showError($('invalidation'), e); }
};
$('equivBtn').onclick = async () => {
  $('equivalence').textContent = '运行中…';
  try {
    const data = await json(`/api/equivalence?batch=${batch()}`);
    $('equivalence').textContent = JSON.stringify(data, null, 2);
    $('statusPill').textContent = data.report.consistent ? '三路径像素一致' : '发现 E_DIFF';
    $('statusPill').className = 'pill' + (data.report.consistent ? '' : ' bad');
  } catch (e) { showError($('equivalence'), e); }
};
document.querySelectorAll('[data-schema]').forEach(btn => btn.onclick = async () => {
  const schema = btn.dataset.schema;
  try {
    const data = await json(`/api/export?batch=${batch()}&to=${encodeURIComponent(schema)}`);
    $('schema').textContent = JSON.stringify({loss: data.loss, roundtrip: data.roundtrip, trail: data.trail?.slice(0, 12), document_preview: data.document}, null, 2);
  } catch (e) { showError($('schema'), e); }
});
loadSamples().catch(e => $('schema').textContent = String(e));
</script>
</body>
</html>
