<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Terrain Bake Diagnostics</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div>
      <h1>分块高度场光照烘焙诊断台</h1>
      <p id="status">正在加载固定种子样本…</p>
    </div>
    <div class="badge" id="seed">seed —</div>
  </header>
  <main>
    <section class="workspace">
      <div class="canvas-toolbar">
        <label>太阳时刻 <select id="time"></select></label>
        <button data-layer="shade" class="active">着色</button>
        <button data-layer="shadow" class="active">阴影</button>
        <button data-layer="sky">天空可见度</button>
        <button data-layer="seam" class="active">交接边</button>
        <span class="hint">点击画布可选分块顶点</span>
      </div>
      <canvas id="terrain" width="900" height="660"></canvas>
      <div class="legend">
        <span><i class="swatch shade"></i>辐照着色</span>
        <span><i class="swatch shadow"></i>直射阴影</span>
        <span><i class="swatch sky"></i>天空可见度</span>
        <span><i class="swatch seam"></i>跨块交接边</span>
        <span><i class="swatch invalid"></i>本轮失效块</span>
      </div>
    </section>
    <aside>
      <div class="card">
        <h2>三路径比对</h2>
        <div id="comparison" class="result">—</div>
        <dl>
          <dt>真值最大天空误差</dt><dd id="skyError">—</dd>
          <dt>真值最大辐照误差</dt><dd id="irrError">—</dd>
          <dt>并行度 / 队列</dt><dd id="budget">—</dd>
          <dt>顶点批次</dt><dd id="batches">—</dd>
        </dl>
      </div>
      <div class="card">
        <h2>抬升高度</h2>
        <label>分块 <select id="chunk"></select></label>
        <div class="row">
          <label>X <input id="vx" type="number" min="0" value="2"></label>
          <label>Z <input id="vz" type="number" min="0" value="2"></label>
          <label>Δh <input id="delta" type="number" step="0.25" value="3.5"></label>
        </div>
        <div class="row actions">
          <button id="raise" class="primary">抬升并增量重烘焙</button>
          <button id="reset">重置断点</button>
        </div>
        <p class="hint" id="editHint">未编辑，真值对照有效。</p>
      </div>
      <div class="card">
        <h2>失效传播</h2>
        <ul id="invalidations" class="list"><li>暂无</li></ul>
      </div>
      <div class="card">
        <h2>跨块交接</h2>
        <ul id="seams" class="list"><li>暂无</li></ul>
      </div>
    </aside>
  </main>
  <script src="/app.js"></script>
</body>
</html>
