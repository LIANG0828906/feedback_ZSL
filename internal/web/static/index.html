<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>房间混响区划工作台</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>房间混响区划工作台</h1>
      <p id="subtitle">确定性样本生成器 · 固定种子 · 整型几何路径</p>
    </div>
    <div class="progress-card">
      <div class="progress-line"><strong id="progressText">0/0</strong><span>已提交房间</span></div>
      <div class="progress"><div id="progressBar"></div></div>
      <div id="commitSequence" class="sequence"></div>
    </div>
  </header>

  <div id="errorBanner" class="banner hidden"></div>

  <main class="layout">
    <section class="card floor-card">
      <div class="card-head">
        <h2>二维区划与传播路径</h2>
        <div class="toggles">
          <label><input type="checkbox" id="togglePaths" checked /> 有效路径</label>
          <label><input type="checkbox" id="toggleOcclusion" checked /> 遮挡标记</label>
        </div>
      </div>
      <svg id="floorSvg" viewBox="0 0 720 430" role="img" aria-label="房间平面图"></svg>
      <div class="legend">
        <span><i class="sw committed"></i>已提交</span>
        <span><i class="sw pending"></i>待求解/复用</span>
        <span><i class="sw analyzing"></i>分析中</span>
        <span><i class="sw solving"></i>求解中</span>
        <span><i class="sw failed"></i>失败/失效</span>
        <span><i class="line door"></i>门洞</span>
        <span><i class="cross">×</i>遮挡</span>
      </div>
      <p class="hint">拖动内墙中点圆点可移动整条共边界线；点击墙段后可在中点加门洞，点击门洞后可删除。</p>
    </section>

    <aside class="side">
      <section class="card">
        <div class="card-head"><h2>编辑与提交</h2></div>
        <div class="controls">
          <label>听者曲线
            <select id="listenerSelect"></select>
          </label>
          <div class="row">
            <button id="addDoorBtn">选中墙加门洞</button>
            <button id="deleteDoorBtn" class="danger">删除选中门洞</button>
          </div>
          <p id="selectionText" class="selection">未选择墙/门洞</p>

          <label>房间混响参数
            <select id="roomSelect"></select>
          </label>
          <div class="grid3">
            <label>RT60 ms<input id="rt60Input" type="number" min="100" max="10000" step="100" /></label>
            <label>密度 0-1<input id="densityInput" type="number" min="0" max="1" step="0.05" /></label>
            <label>Gain dB<input id="gainInput" type="number" min="-24" max="24" step="0.5" /></label>
          </div>
          <button id="applyParamsBtn" class="primary">提交参数并重算受影响听者</button>

          <div class="row wrap">
            <button id="fullBtn">空缓存全量重算</button>
            <button id="compareBtn" class="primary">增量/全量逐项比对</button>
            <button id="truthBtn">校验解析真值</button>
            <button id="resumeBtn">断点续算/重试</button>
            <button id="recoverBtn">模拟重启恢复 SQLite</button>
          </div>
          <pre id="diffOutput" class="diff-output">尚未比对。</pre>
        </div>
      </section>

      <section class="card curve-card">
        <div class="card-head"><h2>逐听者衰减曲线</h2></div>
        <svg id="curveSvg" viewBox="0 0 420 240" role="img" aria-label="衰减曲线"></svg>
        <div id="splList" class="spl-list"></div>
      </section>
    </aside>

    <section class="card invalidation-card">
      <div class="card-head"><h2>精确失效传播清单</h2><span id="topoOrder" class="topo"></span></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>类型</th><th>对象</th><th>房间</th><th>失效/复用原因</th><th>状态</th><th>复用</th></tr></thead>
          <tbody id="invalidationBody"></tbody>
        </table>
      </div>
    </section>

    <section class="card diag-card">
      <div class="card-head"><h2>并发资源边界与异常注入</h2></div>
      <div id="schedulerText" class="scheduler"></div>
      <div class="row wrap">
        <button data-inject="source_out_of_bounds">注入声源越界 E_SCHEMA</button>
        <button data-inject="listener_out_of_bounds">注入听者越界 E_SCHEMA</button>
        <button data-inject="door_nonadjacent">门洞指向非相邻墙 E_GEOM</button>
        <button data-inject="room_overlap">房间矩形重叠 E_GEOM</button>
        <button data-inject="room_failure" class="danger">注入 R2 内部失败 E_STATE</button>
        <button id="badPrecisionBtn">精度参数越界 E_PARA</button>
      </div>
      <div class="table-wrap small">
        <table>
          <thead><tr><th>任务</th><th>排队原因</th><th>等待 ms</th><th>时间</th></tr></thead>
          <tbody id="queueBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
