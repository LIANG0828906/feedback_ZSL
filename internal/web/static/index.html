<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OCR Workbench</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10151b;
      --panel: #171f28;
      --panel2: #1e2a35;
      --line: #304152;
      --text: #e6edf3;
      --muted: #8ca0b3;
      --accent: #64d2a4;
      --accent2: #79b8ff;
      --warn: #ffc866;
      --bad: #ff7b72;
      --pending: #697d91;
      --shadow: 0 16px 40px rgba(0,0,0,.28);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at 20% 0%, #1c2a36 0, var(--bg) 42%);
      color: var(--text);
      font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 22px;
      border-bottom: 1px solid var(--line);
      background: rgba(14,20,26,.88);
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(12px);
    }
    h1 { font-size: 17px; margin: 0; letter-spacing: .03em; }
    h1 span { color: var(--accent); }
    .spacer { flex: 1; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 9px;
      color: var(--muted);
      background: var(--panel);
      font-size: 12px;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--pending); }
    .dot.running { background: var(--accent2); box-shadow: 0 0 10px var(--accent2); }
    .dot.ok { background: var(--accent); }
    .dot.bad { background: var(--bad); }
    .dot.paused { background: var(--warn); }
    button, select {
      border: 1px solid var(--line);
      background: var(--panel2);
      color: var(--text);
      border-radius: 7px;
      padding: 7px 11px;
      font: inherit;
      cursor: pointer;
    }
    button:hover, select:hover { border-color: var(--accent2); }
    button.primary { background: #173a30; border-color: #2b7258; color: #c9ffe9; }
    button.danger { background: #3a1d1d; border-color: #7a3535; color: #ffd7d3; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    main { padding: 20px; display: grid; gap: 18px; max-width: 1600px; margin: 0 auto; }
    .toolbar { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }
    .toolbar label { color: var(--muted); font-size: 12px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(360px, .85fr); gap: 18px; }
    .panel {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(30,42,53,.9), rgba(23,31,40,.94));
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .panel h2 {
      margin: 0;
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 11px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(16,21,27,.4);
    }
    .panel-body { padding: 14px; }
    .image-box {
      position: relative;
      background: #070a0d;
      min-height: 280px;
      display: grid;
      place-items: center;
    }
    .image-stage {
      position: relative;
      display: inline-block;
      max-width: 100%;
      max-height: 62vh;
      line-height: 0;
    }
    .image-box img { display: block; max-width: 100%; max-height: 62vh; object-fit: contain; }
    .image-box svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .image-box polygon {
      fill: rgba(100,210,164,.05);
      stroke: var(--accent);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
      cursor: pointer;
    }
    .image-box polygon.failed { stroke: var(--bad); fill: rgba(255,123,114,.08); }
    .image-box polygon.selected { stroke: var(--warn); stroke-width: 3; fill: rgba(255,200,102,.1); }
    .empty {
      color: var(--muted);
      padding: 34px;
      text-align: center;
    }
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; }
    .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; }
    .stat .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
    .stat .v { font-size: 20px; margin-top: 2px; color: var(--accent); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; border-bottom: 1px solid rgba(48,65,82,.62); padding: 7px 8px; white-space: nowrap; }
    th { color: var(--muted); font-size: 11px; font-weight: 500; letter-spacing: .07em; }
    tbody tr { cursor: pointer; }
    tbody tr:hover, tbody tr.selected { background: rgba(121,184,255,.08); }
    .status { font-size: 11px; border: 1px solid var(--line); padding: 2px 6px; border-radius: 999px; color: var(--muted); }
    .status.committed { color: var(--accent); border-color: #2e6b57; }
    .status.failed { color: var(--bad); border-color: #793d3b; }
    .status.detecting, .status.recognizing { color: var(--accent2); border-color: #355a7a; }
    .status.pending, .status.pending_recognition { color: var(--pending); }
    .tile-grid { display: grid; gap: 6px; }
    .tile {
      min-height: 48px;
      border-radius: 7px;
      border: 1px solid var(--line);
      background: #18222c;
      padding: 6px;
      color: var(--muted);
      font-size: 10px;
      overflow: hidden;
    }
    .tile.committed { background: rgba(45,111,86,.35); border-color: #32745d; color: #c8ffe9; }
    .tile.failed { background: rgba(116,45,43,.35); border-color: #7a3d3b; color: #ffd6d2; }
    .tile.detecting { background: rgba(53,96,133,.35); border-color: #3e6f98; color: #d9ecff; }
    .tile b { display: block; color: inherit; font-size: 12px; }
    .line-matrix { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); gap: 6px; margin-top: 12px; }
    .line-cell { border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; font-size: 10px; color: var(--muted); }
    .line-cell.committed { border-color: #32745d; color: #c8ffe9; }
    .line-cell.failed { border-color: #7a3d3b; color: #ffd6d2; }
    .legend { display: flex; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: 11px; margin-top: 10px; }
    .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; vertical-align: -1px; margin-right: 4px; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .text { font-size: 18px; letter-spacing: .07em; color: #dfffea; word-break: break-all; }
    .muted { color: var(--muted); }
    .confidence { height: 6px; border-radius: 999px; background: #273646; overflow: hidden; min-width: 64px; }
    .confidence > i { display: block; height: 100%; background: linear-gradient(90deg, var(--warn), var(--accent)); }
    .chars { display: flex; flex-wrap: wrap; gap: 6px; }
    .char {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 5px 6px;
      min-width: 44px;
      background: var(--panel);
      text-align: center;
    }
    .char b { color: var(--accent2); font-size: 16px; }
    .char small { color: var(--muted); display: block; }
    .compare {
      border: 1px solid #2b7258;
      border-radius: 10px;
      padding: 12px 14px;
      background: rgba(28,70,55,.28);
    }
    .compare.bad { border-color: #7a3d3b; background: rgba(86,39,38,.28); }
    .compare ul { margin: 8px 0 0; padding-left: 18px; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .tabs button.active { border-color: var(--accent); color: var(--accent); }
    a { color: var(--accent2); }
    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .stats { grid-template-columns: repeat(2, minmax(0,1fr)); }
      header { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
<header>
  <h1><span>OCR</span> Workbench <span class="muted">/ local deterministic lab</span></h1>
  <span class="spacer"></span>
  <span id="status-badge" class="badge"><i class="dot"></i><span>idle</span></span>
  <span id="verify-badge" class="badge"><i class="dot"></i><span>verifying</span></span>
</header>
<main>
  <section class="panel">
    <div class="panel-body toolbar">
      <button id="btn-run" class="primary">开始 / 运行三路径</button>
      <button id="btn-pause">暂停</button>
      <button id="btn-resume">继续</button>
      <button id="btn-cancel" class="danger">取消</button>
      <button id="btn-retry">重试未提交单元</button>
      <span class="spacer"></span>
      <label for="path-select">结果路径</label>
      <select id="path-select">
        <option value="realtime">实时处理</option>
        <option value="resume">断点恢复</option>
        <option value="full">全量重算</option>
      </select>
      <label for="image-select">图像</label>
      <select id="image-select"></select>
      <a id="export-link" class="badge" href="/api/export?kind=realtime">导出当前路径</a>
    </div>
  </section>

  <section id="progress-row" class="stats"></section>

  <section class="layout">
    <div class="panel">
      <h2>原图与检测叠加 / Detections</h2>
      <div id="image-box" class="image-box"><div class="empty">等待本地样本与处理结果…</div></div>
    </div>
    <div class="panel">
      <h2>整图统计 / Image stats</h2>
      <div class="panel-body">
        <div id="stats" class="stats"></div>
        <div id="image-truth" class="muted" style="margin-top:12px"></div>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>文本行与逐行查看 / Text lines</h2>
    <div class="panel-body" style="padding:0">
      <table>
        <thead><tr><th>#</th><th>状态</th><th>识别文本</th><th>真值文本</th><th>置信度</th><th>IoU</th><th>字符</th></tr></thead>
        <tbody id="lines-body"><tr><td colspan="7" class="empty">暂无结果</td></tr></tbody>
      </table>
    </div>
  </section>

  <section class="layout">
    <div class="panel">
      <h2>文本行详情 / Line detail</h2>
      <div class="panel-body" id="line-detail"><div class="empty">点击任意文本行查看逐字符置信度</div></div>
    </div>
    <div class="panel">
      <h2>瓦片状态矩阵 / Tile state matrix</h2>
      <div class="panel-body">
        <div id="tile-grid" class="tile-grid"></div>
        <div id="line-state-grid" class="line-matrix"></div>
        <div class="legend">
          <span><i class="swatch" style="background:#18222c"></i>待处理</span>
          <span><i class="swatch" style="background:#274b65"></i>检测中</span>
          <span><i class="swatch" style="background:#2d6f56"></i>已提交</span>
          <span><i class="swatch" style="background:#742d2b"></i>失败</span>
        </div>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>三路径一致性 / Verification</h2>
    <div class="panel-body">
      <div id="compare" class="compare"><b>等待三路径运行…</b></div>
    </div>
  </section>
</main>
<script>
const $ = (s) => document.querySelector(s);
let state = null;
let selectedImage = null;
let selectedLine = null;

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
function chosenRun() {
  return state?.runs?.[$("#path-select").value] || null;
}
function chosenImage() {
  const run = chosenRun();
  if (!run) return null;
  return run.images.find(i => i.image_id === selectedImage) || run.images[0] || null;
}
function statusClass(value) { return String(value || "").replace(/[^a-z_]/g, ""); }
function pct(v) { return `${(Number(v || 0) * 100).toFixed(1)}%`; }

async function api(path, method = "GET") {
  const response = await fetch(path, {method});
  if (!response.ok) {
    let text = await response.text();
    throw new Error(text);
  }
  return response.headers.get("content-type")?.includes("json") ? response.json() : response.text();
}

async function refresh() {
  try {
    state = await api("/api/state");
    if (!selectedImage && state.manifest?.images?.length) selectedImage = state.manifest.images[0].id;
    renderHeader();
    renderControls();
    renderSelectors();
    renderProgress();
    renderImage();
    renderStats();
    renderLines();
    renderTiles();
    renderCompare();
  } catch (err) {
    console.error(err);
  }
}

function renderHeader() {
  const badge = $("#status-badge");
  const dot = badge.querySelector(".dot");
  const label = badge.querySelector("span");
  dot.className = "dot";
  if (state?.running) {
    dot.classList.add(state.paused ? "paused" : "running");
    label.textContent = state.paused ? "paused" : "processing";
  } else if (state?.last_error) {
    dot.classList.add("bad"); label.textContent = "error";
  } else if (state?.verification_ok) {
    dot.classList.add("ok"); label.textContent = "ready";
  } else {
    label.textContent = "idle";
  }
  const verify = $("#verify-badge");
  const vdot = verify.querySelector(".dot");
  const vtext = verify.querySelector("span");
  vdot.className = "dot";
  if (state?.verification_ok) { vdot.classList.add("ok"); vtext.textContent = "3 paths identical"; }
  else if (state?.comparison?.length) { vdot.classList.add("bad"); vtext.textContent = `${state.comparison.length} violation(s)`; }
  else { vtext.textContent = "verification pending"; }
}

function renderControls() {
  $("#btn-run").disabled = !!state?.running;
  $("#btn-pause").disabled = !state?.running || !!state?.paused;
  $("#btn-resume").disabled = !state?.paused;
  $("#btn-cancel").disabled = !state?.running;
  $("#btn-retry").disabled = !!state?.running;
  $("#export-link").href = `/api/export?kind=${encodeURIComponent($("#path-select").value)}`;
}

function renderSelectors() {
  const select = $("#image-select");
  const images = state?.manifest?.images || [];
  const current = select.value;
  if (select.options.length !== images.length) {
    select.innerHTML = images.map(i => `<option value="${esc(i.id)}">${esc(i.id)} · ${i.width}×${i.height}</option>`).join("");
  }
  if (selectedImage) select.value = selectedImage;
  else if (current) selectedImage = current;
}

function renderProgress() {
  const row = $("#progress-row");
  const kinds = [["realtime","实时"],["resume","恢复"],["full","全量"]];
  row.innerHTML = kinds.map(([kind,label]) => {
    const p = state?.progress?.[kind] || {committed_tiles:0,total_tiles:0,committed_lines:0,total_lines:0};
    return `<div class="stat"><div class="k">${label}提交进度</div><div class="v">${p.committed_tiles}/${p.total_tiles} · ${p.committed_lines}/${p.total_lines}</div></div>`;
  }).join("") + `<div class="stat"><div class="k">样本 / 模板</div><div class="v">${state?.manifest?.images?.length || 0} · ${esc(state?.manifest?.template_version || "-")}</div></div>`;
}

function renderImage() {
  const box = $("#image-box");
  const image = chosenImage();
  if (!image) {
    box.innerHTML = `<div class="empty">等待本地样本与处理结果…</div>`;
    return;
  }
  const truth = state.manifest.images.find(i => i.id === image.image_id);
  box.innerHTML = `
    <div class="image-stage">
      <img src="/image/${encodeURIComponent(image.image_id)}" alt="${esc(image.image_id)}">
      <svg viewBox="0 0 ${truth?.width || 1} ${truth?.height || 1}" preserveAspectRatio="none">
        ${image.lines.map(line => {
          const points = line.box.map(p => `${p.x},${p.y}`).join(" ");
          const cls = [line.state === "failed" ? "failed" : "", selectedLine === line.number ? "selected" : ""].join(" ");
          return `<polygon class="${cls}" data-line="${line.number}" points="${points}"><title>#${line.number} ${esc(line.text)} · ${pct(line.confidence)}</title></polygon>`;
        }).join("")}
      </svg>
    </div>`;
  box.querySelectorAll("polygon").forEach(poly => {
    poly.addEventListener("click", () => { selectedLine = Number(poly.dataset.line); render(); });
  });
}

function renderStats() {
  const image = chosenImage();
  if (!image) {
    $("#stats").innerHTML = "";
    $("#image-truth").textContent = "";
    return;
  }
  const s = image.stats;
  $("#stats").innerHTML = [
    ["文本行", s.line_count], ["字符", s.character_count],
    ["平均置信度", pct(s.average_confidence)], ["空行", s.empty_line_count]
  ].map(([k,v]) => `<div class="stat"><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`).join("");
  const truth = state.manifest.images.find(i => i.id === image.image_id);
  $("#image-truth").innerHTML = `真值区域 <b>${truth?.regions?.length || 0}</b> · 检测行 <b>${image.lines.length}</b> · 真值指纹 <span class="mono">${esc((state.manifest.truth_fingerprint || "").slice(0,16))}…</span>`;
}

function renderLines() {
  const image = chosenImage();
  const body = $("#lines-body");
  if (!image) {
    body.innerHTML = `<tr><td colspan="7" class="empty">暂无结果</td></tr>`;
    renderLineDetail();
    return;
  }
  body.innerHTML = image.lines.map(line => `
    <tr data-line="${line.number}" class="${selectedLine === line.number ? "selected" : ""}">
      <td>${line.number}</td>
      <td><span class="status ${statusClass(line.state)}">${esc(line.state)}</span></td>
      <td class="mono">${line.is_empty ? '<span class="muted">[EMPTY]</span>' : esc(line.text)}</td>
      <td class="mono muted">${esc(line.truth_text || "-")}</td>
      <td><span class="confidence"><i style="width:${Math.round((line.confidence||0)*100)}%"></i></span> ${pct(line.confidence)}</td>
      <td>${Number(line.truth_iou || 0).toFixed(3)}</td>
      <td>${line.characters?.length || 0}</td>
    </tr>`).join("") || `<tr><td colspan="7" class="empty">本图没有检测到文本行</td></tr>`;
  body.querySelectorAll("tr[data-line]").forEach(row => {
    row.addEventListener("click", () => { selectedLine = Number(row.dataset.line); render(); });
  });
  renderLineDetail();
}

function renderLineDetail() {
  const detail = $("#line-detail");
  const image = chosenImage();
  const line = image?.lines?.find(l => l.number === selectedLine);
  if (!line) {
    detail.innerHTML = `<div class="empty">点击任意文本行查看逐字符置信度</div>`;
    return;
  }
  detail.innerHTML = `
    <div class="detail-grid">
      <div>
        <div class="muted">行 #${line.number} · 阅读序号 ${line.reading_index} · 来源瓦片 ${line.tile_index}</div>
        <div class="text">${line.is_empty ? "[EMPTY LINE]" : esc(line.text)}</div>
        <div class="muted">置信度 ${pct(line.confidence)} · ${esc(line.empty_reason || "")} ${line.error ? "· " + esc(line.error) : ""}</div>
      </div>
      <div>
        <div class="muted">切分参数（提交后冻结）</div>
        <div class="mono">gap=${line.segment_params?.min_char_gap} width=${line.segment_params?.max_char_width} area=${line.segment_params?.min_char_area}</div>
        <div class="muted" style="margin-top:8px">Content hash</div>
        <div class="mono">${esc((line.content_hash || "").slice(0,24))}…</div>
      </div>
    </div>
    <div class="chars" style="margin-top:14px">
      ${(line.characters || []).map(c => `<div class="char"><b>${esc(c.text)}</b><small>${pct(c.confidence)}</small></div>`).join("") || '<span class="muted">空行：没有字符结果，但文本行保留且已显式标记。</span>'}
    </div>`;
}

function renderTiles() {
  const grid = $("#tile-grid");
  const image = chosenImage();
  if (!image) { grid.innerHTML = ""; return; }
  const maxCol = Math.max(1, ...image.tiles.map(t => t.col));
  grid.style.gridTemplateColumns = `repeat(${maxCol + 1}, minmax(0, 1fr))`;
  grid.innerHTML = image.tiles.map(tile => `
    <div class="tile ${statusClass(tile.state)}" title="${esc(tile.error || "")}">
      <b>#${tile.index}</b>
      r${tile.row}c${tile.col} · ${esc(tile.state)}<br>
      candidates ${tile.candidates?.length || 0}
    </div>`).join("");
  const lineGrid = $("#line-state-grid");
  lineGrid.innerHTML = image.lines.map(line => `
    <div class="line-cell ${statusClass(line.state)}">line #${line.number}<br>${esc(line.state)}</div>
  `).join("");
}

function renderCompare() {
  const box = $("#compare");
  const issues = state?.comparison || [];
  if (!state?.runs?.realtime) {
    box.className = "compare";
    box.innerHTML = `<b>等待三路径运行…</b>`;
    return;
  }
  box.className = "compare" + (issues.length ? " bad" : "");
  box.innerHTML = issues.length
    ? `<b>三路径不一致：首个违规位置 ${esc(issues[0].image_id || "-")} / line ${issues[0].line}</b><ul>${issues.slice(0,12).map(i => `<li><span class="mono">${esc(i.image_id)}:${i.line}</span> ${esc(i.field)} — ${esc(i.detail)}</li>`).join("")}</ul>`
    : `<b>三路径一致：识别文本、逐字符置信度、阅读顺序索引、瓦片/文本行提交序列与统计完全相同。</b><div class="muted" style="margin-top:6px">SQLite 单位哈希、模板版本、参数版本与算法版本均已校验；验证器同时重算了行数、IoU 与置信度分布。</div>`;
}

function render() {
  renderHeader(); renderControls(); renderImage(); renderStats(); renderLines(); renderTiles(); renderCompare();
}

$("#path-select").addEventListener("change", () => {
  selectedLine = null;
  $("#export-link").href = `/api/export?kind=${encodeURIComponent($("#path-select").value)}`;
  render();
});
$("#image-select").addEventListener("change", e => { selectedImage = e.target.value; selectedLine = null; render(); });
