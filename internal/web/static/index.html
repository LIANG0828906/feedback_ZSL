<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AudioForge Envelope Diagnostics</title>
  <style>
    :root {
      --bg: #071014;
      --panel: #0d1b21;
      --panel2: #10252d;
      --line: #23414b;
      --text: #d9f0f5;
      --muted: #7ea1ab;
      --accent: #3ee0b0;
      --accent2: #64a7ff;
      --warn: #ffbe5c;
      --bad: #ff6b7a;
      --good: #50e3a4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 0%, rgba(62,224,176,.13), transparent 34rem),
        radial-gradient(circle at 85% 10%, rgba(100,167,255,.10), transparent 30rem),
        var(--bg);
      font: 14px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    }
    main { max-width: 1480px; margin: 0 auto; padding: 30px 24px 70px; }
    header { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    h1 { margin: 0; font-size: clamp(24px, 3vw, 42px); letter-spacing: -.03em; }
    h1 span { color: var(--accent); }
    h2 { font-size: 18px; margin: 0 0 14px; letter-spacing: .01em; }
    h3 { font-size: 14px; margin: 0 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    .sub { color: var(--muted); margin-top: 6px; }
    button {
      background: var(--panel2); color: var(--text); border: 1px solid var(--line);
      padding: 9px 15px; border-radius: 9px; cursor: pointer; font: inherit;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    .grid { display: grid; gap: 16px; }
    .stats { grid-template-columns: repeat(6, minmax(0, 1fr)); margin-bottom: 18px; }
    .two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .panel {
      background: linear-gradient(160deg, rgba(16,37,45,.93), rgba(9,22,27,.93));
      border: 1px solid var(--line); border-radius: 15px; padding: 18px;
      box-shadow: 0 16px 50px rgba(0,0,0,.16);
      min-width: 0;
    }
    .stat .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
    .stat .value { font-size: 25px; font-weight: 650; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; }
    .stat .hint { color: var(--muted); font-size: 12px; margin-top: 3px; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px;
      border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 12px;
      margin: 2px 4px 2px 0;
    }
    .ok { color: var(--good); border-color: rgba(80,227,164,.35); }
    .bad { color: var(--bad); border-color: rgba(255,107,122,.4); }
    .warn { color: var(--warn); border-color: rgba(255,190,92,.4); }
    .mono { font-family: "Cascadia Code", Consolas, monospace; }
    .muted { color: var(--muted); }
    .small { font-size: 12px; }
    section { margin-top: 26px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .section-head h2 { margin: 0; }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    th { color: var(--muted); font-weight: 500; text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    td { padding: 7px 8px; border-bottom: 1px solid rgba(35,65,75,.52); vertical-align: top; }
    tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: rgba(62,224,176,.035); }
    .samples { max-width: 410px; overflow-wrap: anywhere; color: #b9d7df; }
    .branch-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
    .branch { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: rgba(7,16,20,.35); }
    .branch.active { border-color: rgba(62,224,176,.65); box-shadow: inset 0 0 25px rgba(62,224,176,.05); }
    .branch-name { font-size: 16px; font-weight: 650; margin-bottom: 4px; }
    .path { color: var(--accent2); font-family: "Cascadia Code", Consolas, monospace; font-size: 11.5px; }
    .bar { height: 5px; border-radius: 6px; background: #132c34; overflow: hidden; margin-top: 10px; }
    .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); }
    .code { color: var(--bad); font-weight: 650; }
    .issue-code-E_DUP { color: var(--warn); }
    .issue-code-E_TIMEOUT { color: #d28bff; }
    .issue-code-E_MISS { color: var(--bad); }
    details { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; }
    summary { cursor: pointer; color: var(--accent2); }
    .packet-list { max-height: 370px; overflow: auto; margin-top: 10px; }
    .empty { color: var(--muted); padding: 20px; text-align: center; border: 1px dashed var(--line); border-radius: 10px; }
    .flow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .flow-step { padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); }
    .flow-step.done { color: var(--good); border-color: rgba(80,227,164,.34); }
    footer { color: var(--muted); text-align: center; margin-top: 42px; font-size: 12px; }
    @media (max-width: 1100px) {
      .stats { grid-template-columns: repeat(3, 1fr); }
      .three, .branch-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 720px) {
      main { padding: 20px 13px 50px; }
      .stats, .two { grid-template-columns: 1fr; }
      header { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>AudioForge <span>Envelope Diagnostics</span></h1>
      <div class="sub">Deterministic multi-branch combat audio · loopback device echo · SQLite recovery</div>
    </div>
    <div>
      <button id="refresh">Refresh diagnostics</button>
    </div>
  </header>

  <div id="root"><div class="empty">Loading deterministic sample report…</div></div>
  <footer id="generated"></footer>
</main>
<script>
const $ = (s) => document.querySelector(s);
const root = $('#root');
let current = null;

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function preview(samples, limit = 18) {
  const arr = samples || [];
  const head = arr.slice(0, limit).join(', ');
  return arr.length > limit ? head + `, … (${arr.length})` : head;
}
function time(value) {
  if (!value || String(value).startsWith('0001-')) return '—';
  const d = new Date(value);
  return isNaN(d) ? String(value) : d.toLocaleTimeString();
}
function packetKeys(packets) {
  return (packets || []).map(p => `${p.channel}/${p.seq}`).join(', ');
}
function statusPill(ok, yes = 'PASS', no = 'FAIL') {
  return `<span class="pill ${ok ? 'ok' : 'bad'}">${ok ? yes : no}</span>`;
}
function renderStats(r) {
  const anomalies = (r.fault_alignment?.issues || []).length;
  const matches = (r.clean_alignment?.matches || []).length;
  const windows = r.checkpoint?.windows || 0;
  const invalidationCount = (r.invalidations || []).reduce((n, x) => n + (x.invalidated || []).length, 0);
  const cells = [
    ['Seed', r.seed, r.selected_branch],
    ['Events', r.event_count, '3 branch views'],
    ['Packets', (r.channels || []).reduce((n,c) => n + (c.packets||[]).length, 0), `${r.workers} workers · buffer ${r.worker_buffer}`],
    ['Echo matches', matches, 'clean loopback'],
    ['Injected anomalies', anomalies, 'E_MISS / E_DUP / E_TIMEOUT'],
    ['Invalidated packets', invalidationCount, `checkpoint windows ${windows}`],
  ];
  return `<div class="grid stats">${cells.map(([label,value,hint]) =>
    `<div class="panel stat"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div><div class="hint">${esc(hint)}</div></div>`).join('')}</div>`;
}
function renderBranches(r) {
  return `<section><div class="section-head"><h2>Release branch semantics</h2><span class="muted small">Same JSON container · field meaning is branch-specific</span></div>
    <div class="branch-grid">${(r.branches||[]).map(b => `
      <div class="branch ${b.name === r.selected_branch ? 'active' : ''}">
        <div class="branch-name">${esc(b.name)} ${b.name === r.selected_branch ? '<span class="pill ok">selected</span>' : ''}</div>
        <div class="small muted">${esc(b.file)} · ${b.event_count} events · rounding ${esc(b.rounding)}</div>
        <div style="margin-top:9px">
          <span class="pill">time: ${esc(b.time_unit)}</span>
          <span class="pill">value: ${esc(b.value_semantic)}</span>
          <span class="pill">list: ${esc(b.list_semantic)}</span>
        </div>
        <div class="small muted" style="margin-top:10px">First-event trace</div>
        <div class="path">${esc(b.traceability?.event_id)} · ${esc(b.traceability?.branch)}</div>
        <details><summary>source field paths</summary>
          ${Object.entries(b.traceability?.paths || {}).map(([k,v]) => `<div class="small"><span class="muted">${esc(k)}</span> → <span class="path">${esc(v)}</span></div>`).join('')}
        </details>
      </div>`).join('')}</div></section>`;
}
function renderPaths(r) {
  return `<section class="grid two">
    <div class="panel"><h2>Three-path consistency</h2>
      <div class="flow">${(r.path_checks||[]).map((p,i) => `<span class="flow-step done">${i+1}. ${esc(p.name)} ✓</span>`).join('<span class="muted">→</span>')}</div>
      <table style="margin-top:14px"><thead><tr><th>Path</th><th>Result</th><th>Detail</th></tr></thead><tbody>
        ${(r.path_checks||[]).map(p => `<tr><td>${esc(p.name)}</td><td>${statusPill(p.ok)}</td><td class="muted">${esc(p.detail)}</td></tr>`).join('')}
      </tbody></table>
      <div class="small muted" style="margin-top:10px">Forced-stop code: <span class="mono">${esc(r.forced_stop_code || 'not exercised')}</span> · active cancellation is reported separately as E_CANCEL.</div>
    </div>
    <div class="panel"><h2>Generator truth & checkpoints</h2>
      <div class="grid three">
        <div><div class="muted small">Truth verification</div><div style="font-weight:650;color:var(--good)">${esc(r.truth?.verification)}</div></div>
        <div><div class="muted small">Observed sample points</div><div style="font-size:24px;font-weight:650">${r.truth?.sample_points || 0}</div></div>
        <div><div class="muted small">Truth packet ranges</div><div style="font-size:24px;font-weight:650">${r.truth?.packet_ranges || 0}</div></div>
      </div>
      <table style="margin-top:14px"><thead><tr><th>Checkpoint</th><th>Value</th></tr></thead><tbody>
        <tr><td>SQLite path</td><td class="mono">${esc(r.checkpoint?.path)}</td></tr>
        <tr><td>Snapshot complete</td><td>${statusPill(r.checkpoint?.complete, 'complete', 'open')}</td></tr>
        <tr><td>Windows / packets</td><td>${r.checkpoint?.windows || 0} / ${r.checkpoint?.packets || 0}</td></tr>
        <tr><td>Versions</td><td class="mono">${esc(r.checkpoint?.param_version)} · ${esc(r.checkpoint?.algorithm_version)}</td></tr>
      </tbody></table>
      <details><summary>commit sequence</summary>
        <div class="small mono" style="margin-top:8px;max-height:130px;overflow:auto">${(r.checkpoint?.commit_sequence||[]).map(w => `window ${w.index}: ${(w.packet_keys||[]).join(', ')}`).join('<br>')}</div>
      </details>
    </div>
  </section>`;
}
function renderChannels(r) {
  return `<section><div class="section-head"><h2>Channel packet sequences</h2><span class="muted small">Bounded channel workers · serial commits</span></div>
    <div class="grid three">${(r.channels||[]).map(c => `
      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <h2>Channel ${c.channel}</h2>
          <span class="pill">${c.frame_samples} samples</span>
        </div>
        <div class="small muted mono">template ${esc(preview(c.template, 12))}</div>
        <div class="bar"><i style="width:${Math.min(100, (c.packets?.length||0)*8)}%"></i></div>
        <div class="small muted" style="margin-top:8px">${c.packets?.length || 0} packets · ${Object.entries(c.state || {}).map(([k,v]) => `${k}:${v}`).join(' · ')}</div>
        <details open><summary>packet table</summary>
          <div class="packet-list">
            <table><thead><tr><th>#</th><th>range</th><th>timing</th><th>samples</th></tr></thead><tbody>
              ${(c.packets||[]).map(p => `<tr>
                <td class="mono">${p.seq}</td>
                <td class="mono">${p.start}–${p.end}</td>
                <td class="mono">${p.timing_mark}</td>
                <td class="samples mono" title="${esc((p.samples||[]).join(', '))}">${esc(preview(p.samples))}<div class="muted small">${esc((p.depends_on_events||[]).join(' · '))}</div></td>
              </tr>`).join('')}
            </tbody></table>
          </div>
        </details>
        <details><summary>clean echo alignment (${c.matches?.length || 0})</summary>
          <table><thead><tr><th>#</th><th>first seen</th><th>latency</th></tr></thead><tbody>
            ${(c.matches||[]).map(m => `<tr><td class="mono">${m.seq}</td><td>${esc(time(m.first_seen))}</td><td class="mono">${((m.latency||0)/1e6).toFixed(2)} ms</td></tr>`).join('')}
          </tbody></table>
        </details>
      </div>`).join('')}</div></section>`;
}
function renderAnomalies(r) {
  const issues = r.fault_alignment?.issues || [];
  return `<section class="grid two">
    <div class="panel"><div class="section-head"><h2>Echo alignment & anomalies</h2><span class="pill ${issues.length ? 'warn' : 'ok'}">${issues.length} injected</span></div>
      ${issues.length ? `<table><thead><tr><th>Code</th><th>channel / packet</th><th>first seen</th><th>detail</th></tr></thead><tbody>
        ${issues.map(i => `<tr><td class="code issue-code-${esc(i.code)}">${esc(i.code)}</td><td class="mono">${i.channel}/${i.packet_seq}</td><td>${esc(time(i.first_seen))}</td><td class="muted">${esc(i.message)}</td></tr>`).join('')}
      </tbody></table>` : `<div class="empty">No anomalies</div>`}
      <div class="small muted" style="margin-top:12px">Fault plan: drop <span class="mono">0/1</span>, duplicate <span class="mono">0/2</span>, delay <span class="mono">1/0</span> beyond the timing window.</div>
    </div>
    <div class="panel"><h2>Applied echo samples</h2>
      <div class="packet-list"><table><thead><tr><th>channel/#</th><th>dup</th><th>applied at</th><th>samples</th></tr></thead><tbody>
        ${(r.fault_echoes||[]).map(e => `<tr><td class="mono">${e.channel}/${e.seq}</td><td>${e.duplicate ? '<span class="pill warn">yes</span>' : '—'}</td><td>${esc(time(e.applied_at))}</td><td class="samples mono">${esc(preview(e.samples, 10))}</td></tr>`).join('')}
      </tbody></table></div>
    </div>
  </section>`;
}
function renderInvalidations(r) {
  return `<section class="panel"><div class="section-head"><h2>Precise cache invalidation</h2><span class="muted small">First actual change + same-channel suffix</span></div>
    ${(r.invalidations||[]).map(x => `<details ${x.name === 'priority-edit' ? 'open' : ''}>
      <summary><b>${esc(x.name)}</b> · <span class="mono">${esc(x.change?.kind)}</span> · reused ${x.reused_count}/${x.total} packets</summary>
      <table style="margin-top:9px"><thead><tr><th>channel</th><th>packet</th><th>reason</th></tr></thead><tbody>
        ${(x.invalidated||[]).map(i => `<tr><td class="mono">${i.channel}</td><td class="mono">${i.packet_seq}</td><td class="muted">${esc(i.reason)}</td></tr>`).join('') || `<tr><td colspan="3" class="muted">No packets changed.</td></tr>`}
      </tbody></table>
    </details>`).join('')}
  </section>`;
}
function renderDecisions(r) {
  return `<section class="grid two">
    <div class="panel"><h2>Conditional event truth</h2>
      <table><thead><tr><th>Event</th><th>Active</th></tr></thead><tbody>
        ${Object.entries(r.conditions || {}).filter(([k]) => k === 'evt-008' || k === 'evt-011').map(([k,v]) => `<tr><td class="mono">${esc(k)}</td><td>${statusPill(v, 'active', 'suppressed')}</td></tr>`).join('')}
      </tbody></table>
      <div class="small muted" style="margin-top:9px">Conditional events join semantics only when the gate flag is true.</div>
    </div>
    <div class="panel"><h2>Merge decisions</h2>
      <div class="packet-list"><table><thead><tr><th>event</th><th>ch</th><th>action</th><th>reason</th></tr></thead><tbody>
        ${(r.decisions||[]).map(d => `<tr><td class="mono">${esc(d.event_id)}</td><td>${d.channel}</td><td class="${d.action === 'dropped' ? 'muted' : ''}">${esc(d.action)}</td><td class="muted">${esc(d.reason)}</td></tr>`).join('')}
      </tbody></table></div>
    </div>
  </section>`;
}
function render(report) {
  current = report;
  root.innerHTML = renderStats(report) + renderBranches(report) + renderPaths(report) +
    renderChannels(report) + renderAnomalies(report) + renderInvalidations(report) + renderDecisions(report);
  $('#generated').textContent = `Generated ${time(report.generated_at)} · loopback device ${report.device_url} · seeded deterministic fixture`;
}
async function load() {
  try {
    const response = await fetch('/api/report', {cache: 'no-store'});
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    render(await response.json());
  } catch (err) {
    root.innerHTML = `<div class="empty">Unable to load diagnostics: ${esc(err.message)}</div>`;
  }
}
$('#refresh').addEventListener('click', load);
load();
</script>
</body>
</html>
