<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>韵律包络与时长拨配诊断台</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
    body { margin: 0; background: #0b1020; color: #e5edf7; }
    header { padding: 16px 22px; border-bottom: 1px solid #243047; background: #10182b; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    h1 { font-size: 18px; margin: 0; letter-spacing: .04em; }
    main { padding: 18px 22px; display: grid; grid-template-columns: 320px 1fr; gap: 16px; }
    .card { background: #111a2e; border: 1px solid #26344f; border-radius: 12px; padding: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
    .controls { display: grid; gap: 10px; }
    label { display: grid; gap: 4px; font-size: 12px; color: #9fb2cc; }
    input, select, button { border-radius: 8px; border: 1px solid #31415f; background: #0c1426; color: #e5edf7; padding: 8px 10px; font-size: 14px; }
    button { cursor: pointer; background: #1d4ed8; border-color: #2f6df6; font-weight: 650; }
    button.secondary { background: #26344f; border-color: #3b4d70; }
    button:hover { filter: brightness(1.12); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
    .metric { background: #0c1426; border-radius: 8px; padding: 8px; }
    .metric b { display: block; font-size: 16px; color: #7dd3fc; }
    .metric span { font-size: 11px; color: #9fb2cc; }
    canvas { width: 100%; background: #080d1b; border: 1px solid #243047; border-radius: 10px; }
    #wave { height: 280px; }
    #timeline { height: 190px; margin-top: 12px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .full { grid-column: 1 / -1; }
    h2 { font-size: 14px; margin: 0 0 10px; color: #c7d7ef; }
    .ok { color: #86efac; }
    .bad { color: #fca5a5; }
    .warn { color: #fcd34d; }
    ul { margin: 8px 0 0; padding-left: 18px; max-height: 260px; overflow: auto; font-size: 12px; line-height: 1.55; }
    .pill { display: inline-block; border-radius: 999px; padding: 2px 8px; font-size: 12px; margin-right: 6px; }
    .pill.ok { background: rgba(34,197,94,.16); }
    .pill.bad { background: rgba(239,68,68,.18); }
    .pill.warn { background: rgba(234,179,8,.16); }
    pre { white-space: pre-wrap; word-break: break-all; background: #080d1b; padding: 10px; border-radius: 8px; max-height: 320px; overflow: auto; font-size: 11px; }
    .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: #9fb2cc; margin: 8px 0; }
    .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 4px; }
    @media (max-width: 980px) { main { grid-template-columns: 1fr; } .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<header>
  <h1>韵律包络对齐 × 时长拨配诊断台</h1>
  <select id="dialogSelect"></select>
  <span id="globalStatus" class="pill ok">确定性种子 424242</span>
  <span id="compareStatus"></span>
</header>
<main>
  <section class="card controls">
    <h2>增量参数</h2>
    <label>目标整段时长（采样点）<input id="target" type="number" step="16" /></label>
    <label>默认拉伸上界（新增采样点）<input id="cap" type="number" step="50" /></label>
    <label>重音容差（采样点）<input id="tolerance" type="number" step="10" /></label>
    <button id="apply">应用并触发增量重算</button>
    <div class="row">
      <button id="retry" class="secondary">重试失败对白</button>
      <button id="refreshCompare" class="secondary">重跑三路径</button>
    </div>
    <div id="errorBox"></div>
    <div class="metrics" id="schedMetrics"></div>
  </section>

  <section class="card">
    <h2>波形、逐帧包络与重音落点</h2>
    <canvas id="wave" width="1200" height="280"></canvas>
    <div class="legend">
      <span><i class="dot" style="background:#64748b"></i>PCM</span>
      <span><i class="dot" style="background:#22d3ee"></i>归一化包络</span>
      <span><i class="dot" style="background:#ef4444"></i>重音/双峰</span>
      <span><i class="dot" style="background:#facc15"></i>真值重音</span>
    </div>
    <h2>拉伸前后音素区间</h2>
    <canvas id="timeline" width="1200" height="190"></canvas>
  </section>

  <section class="card full grid">
    <div>
      <h2>失效传播清单</h2>
      <div id="manifestSummary"></div>
      <ul id="invalidList"></ul>
    </div>
    <div>
      <h2>三路径比对 / 检查点恢复</h2>
      <div id="compareDetail">尚未加载。</div>
      <pre id="compareJson">点击“重跑三路径”获取完整 JSON。</pre>
    </div>
  </section>
</main>

<script>
let state = null;
let verifyReport = null;

const $ = (id) => document.getElementById(id);
const colors = { vowel: '#34d399', consonant: '#60a5fa', silence: '#64748b', capped: '#f97316' };

async function fetchJSON(url, options) {
  const res = await fetch(url, options);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}

function selectedDialog() {
  const id = $('dialogSelect').value;
  return state.suite.dialogs.find(d => d.project.id === id);
}

function currentResult(dialog) {
  const out = state.last_output;
  const outcome = out && out.outcomes.find(o => o.dialog_id === dialog.project.id);
  return (outcome && outcome.result) || state.results[dialog.project.id] || null;
}

function currentOutcome(dialog) {
  const out = state.last_output;
  return out && out.outcomes.find(o => o.dialog_id === dialog.project.id);
}

function fitMaxSample(project, result) {
  return Math.max(project.declared_target_duration, result?.fit?.target_duration || 0, result?.fit?.final_duration || 0);
}

function setupControls() {
  const dialog = selectedDialog();
  if (!dialog) return;
  const params = state.params[dialog.project.id];
  $('target').value = params.target_duration_samples;
  $('cap').value = params.default_max_stretch_samples;
  $('tolerance').value = params.accent_tolerance_samples;
}

function renderSelect() {
  const sel = $('dialogSelect');
  const current = sel.value || 'dialog-a';
  sel.innerHTML = state.suite.dialogs.map(d => `<option value="${d.project.id}">${d.project.id} · ${d.project.phonemes.length} phonemes</option>`).join('');
  sel.value = current;
  sel.onchange = renderAll;
}

function renderMetrics() {
  const m = state.scheduler_metrics || {};
  $('schedMetrics').innerHTML = [
    ['最大并行度', m.max_parallelism], ['峰值 worker', m.peak_parallel_workers],
    ['排队等待', m.queue_wait_count], ['等待 µs', Math.round((m.queue_wait_nanos || 0) / 1e3)],
    ['已完成分块', m.completed_chunks], ['峰值待处理采样', m.peak_pending_samples]
  ].map(([k,v]) => `<div class="metric"><b>${v ?? '-'}</b><span>${k}</span></div>`).join('');
}

function drawWave() {
  const dialog = selectedDialog();
  if (!dialog) return;
  const p = dialog.project, result = currentResult(dialog);
  const canvas = $('wave'), ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle = '#080d1b'; ctx.fillRect(0,0,w,h);
  const x = s => s / p.sample_count * w;

  ctx.strokeStyle = '#1e293b'; ctx.beginPath(); ctx.moveTo(0,h/2); ctx.lineTo(w,h/2); ctx.stroke();
  p.phonemes.forEach(ph => {
    ctx.strokeStyle = '#1f2a44'; ctx.beginPath(); ctx.moveTo(x(ph.start_sample),0); ctx.lineTo(x(ph.start_sample),h); ctx.stroke();
  });

  ctx.strokeStyle = '#64748b'; ctx.lineWidth = 1; ctx.beginPath();
  const columnCount = w;
  for (let px=0; px<columnCount; px++) {
    const s0 = Math.floor(px / w * p.pcm.length), s1 = Math.max(s0+1, Math.floor((px+1)/w*p.pcm.length));
    let mn=32767, mx=-32768;
    for (let i=s0; i<s1 && i<p.pcm.length; i++) { const v=p.pcm[i]; if(v<mn)mn=v; if(v>mx)mx=v; }
    const y1 = h/2 - mx/32768*(h*0.42), y2 = h/2 - mn/32768*(h*0.42);
    ctx.moveTo(px,y1); ctx.lineTo(px,Math.max(y1+1,y2));
  }
  ctx.stroke();

  if (result?.frames?.length) {
    const scale = p.envelope_params.fixed_point_scale || 1000000;
    ctx.strokeStyle = '#22d3ee'; ctx.lineWidth = 2; ctx.beginPath();
    result.frames.forEach((f,i) => {
      const px = x(f.center_sample), py = h - 18 - f.envelope_fixed / scale * (h-42);
      if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    });
    ctx.stroke();
    const a = result.accent;
    if (a) {
      ctx.strokeStyle = '#ef4444'; ctx.lineWidth=2;
      [a.loudness_peak_sample, a.pitch_peak_sample].forEach((s, idx) => {
        ctx.setLineDash(idx ? [5,4] : []);
        ctx.beginPath(); ctx.moveTo(x(s),10); ctx.lineTo(x(s),h-10); ctx.stroke();
      });
      ctx.setLineDash([]);
    }
  }
  const truthX = x(dialog.truth.accent_sample);
  ctx.strokeStyle = '#facc15'; ctx.setLineDash([2,4]); ctx.beginPath(); ctx.moveTo(truthX,8); ctx.lineTo(truthX,h-8); ctx.stroke(); ctx.setLineDash([]);
}

function drawTimeline() {
  const dialog = selectedDialog();
  if (!dialog) return;
  const p = dialog.project, result = currentResult(dialog);
  const canvas=$('timeline'), ctx=canvas.getContext('2d'), w=canvas.width,h=canvas.height;
  ctx.clearRect(0,0,w,h); ctx.fillStyle='#080d1b'; ctx.fillRect(0,0,w,h);
  const max = fitMaxSample(p,result);
  const x = s => 40 + s/max*(w-80);
  ctx.fillStyle='#9fb2cc'; ctx.font='12px sans-serif';
  ctx.fillText('拉伸前', 4, 34); ctx.fillText('拉伸后', 4, 94);
  p.phonemes.forEach((ph,i) => {
    const color = colors[ph.kind] || '#94a3b8';
    ctx.fillStyle=color+'aa';
    ctx.fillRect(x(ph.start_sample),20,Math.max(2,x(ph.end_sample)-x(ph.start_sample)),28);
    ctx.fillStyle='#e5edf7'; ctx.fillText(String(i),x(ph.start_sample)+4,38);
    const seg = result?.fit?.segments?.[i];
    if (seg) {
      ctx.fillStyle = seg.cap_triggered ? colors.capped : color;
      ctx.fillRect(x(seg.new_start),80,Math.max(2,x(seg.new_end)-x(seg.new_start)),28);
      ctx.fillStyle='#e5edf7'; ctx.fillText(String(i)+(seg.cap_triggered?'▲':''),x(seg.new_start)+4,98);
    }
  });
  if (result?.accent) {
    const a=result.accent;
    ctx.strokeStyle='#ef4444'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(x(a.sample),55); ctx.lineTo(x(a.sample),120); ctx.stroke();
    if (result.fit?.warped_accent) {
      ctx.strokeStyle='#fca5a5'; ctx.beginPath(); ctx.moveTo(x(result.fit.warped_accent),108); ctx.lineTo(x(result.fit.warped_accent),130); ctx.stroke();
    }
  }
  ctx.fillStyle='#9fb2cc';
  ctx.fillText('▲ 表示触及上界；时间轴按目标/结果最大采样数归一化', 40, 150);
}

function renderManifest() {
  const m = state.last_output?.manifest;
  const invalid = m?.items || [], reused = m?.reused_items || [];
  $('manifestSummary').innerHTML = `<span class="pill bad">失效 ${invalid.length}</span><span class="pill ok">复用 ${reused.length}</span><span class="pill warn">${m?.edit || ''}</span>`;
  $('invalidList').innerHTML = invalid.map(i => `<li><b>${i.dialog_id}${i.phoneme_index!=null?' / p'+i.phoneme_index:''}</b> · ${i.node_kind}<br><span class="warn">${i.reason}</span><br><span style="color:#9fb2cc">范围：${i.scope || '-'}</span></li>`).join('') || '<li>无失效项。</li>';
}

function renderError() {
  const dialog = selectedDialog();
  const o = dialog && currentOutcome(dialog);
  if (o && !o.ok && o.error_detail) {
    $('errorBox').innerHTML = `<div class="pill bad">${o.error_detail.code}</div><span class="bad">${o.error_detail.message}</span>`;
  } else {
    $('errorBox').innerHTML = '<span class="ok">当前对白拟合可行。</span>';
  }
}

function renderVerifySummary() {
  const s = state.verify_summary;
  if (!s) return;
  $('compareStatus').innerHTML = s.all_equal ? '<span class="pill ok">三路径一致</span>' : '<span class="pill bad">存在不一致</span>';
  const b = s.recovery_boundary || {};
  $('compareDetail').innerHTML = `
    <p>逐采样点比对：<b class="${s.all_equal?'ok':'bad'}">${s.all_equal?'ALL EQUAL':'MISMATCH'}</b>；提交序列：<b class="${s.commit_sequences_equal?'ok':'bad'}">${s.commit_sequences_equal?'EQUAL':'DIFF'}</b></p>
    <p>恢复边界：valid=${b.snapshot_valid}，已完成键=${(b.completed_commit_keys||[]).join(' ')}，resume_seq=${b.resume_logical_seq} ${b.mismatch?('，<span class="bad">'+b.mismatch+'</span>'):''}</p>
    <ul>${(s.truth||[]).map(t=>`<li>${t.dialog_id}: envelope=${t.envelope_exact?'<span class=ok>exact</span>':'<span class=bad>diff</span>'}, fit=${t.fit_exact?'<span class=ok>exact</span>':'<span class=bad>diff</span>'}, accent_error=${t.accent_error_samples}, tol=${t.accent_within_tolerance}</li>`).join('')}</ul>`;
}

function renderAll() {
  if (!state) return;
  renderSelect(); setupControls(); renderMetrics(); drawWave(); drawTimeline(); renderManifest(); renderError(); renderVerifySummary();
}

async function loadState() {
  state = await fetchJSON('/api/state');
  renderAll();
}

$('apply').onclick = async () => {
  const body = {
    target_duration_samples: Number($('target').value),
    default_max_stretch_samples: Number($('cap').value),
    accent_tolerance_samples: Number($('tolerance').value),
    description: 'UI parameter adjustment'
  };
  try {
    const data = await fetchJSON('/api/edit', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    state.last_output = data.output; state.results = data.results; state.scheduler_metrics = data.scheduler_metrics; state.epoch = data.epoch;
    renderAll();
  } catch (e) { $('errorBox').innerHTML = `<span class="bad">${e.message}</span>`; }
};
$('retry').onclick = async () => {
  const data = await fetchJSON('/api/retry', {method:'POST'});
  state.last_output = data.output; state.results = data.results;
  renderAll();
};
$('refreshCompare').onclick = async () => {
  verifyReport = await fetchJSON('/api/verify?refresh=1');
  $('compareJson').textContent = JSON.stringify(verifyReport.comparison, null, 2) + '\n\n' + JSON.stringify(verifyReport.recovery_boundary, null, 2);
  state.verify_summary = { all_equal: verifyReport.comparison.all_equal, commit_sequences_equal: verifyReport.comparison.commit_sequences_equal, first_mismatch: verifyReport.comparison.first_mismatch, recovery_boundary: verifyReport.recovery_boundary, truth: verifyReport.truth };
  renderVerifySummary();
};
loadState().catch(e => { document.body.insertAdjacentHTML('beforeend', '<pre class="bad">'+e.message+'</pre>'); });
</script>
</body>
</html>
