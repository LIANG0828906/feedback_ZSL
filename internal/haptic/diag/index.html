<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>触觉反馈确定性内核诊断台</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif; }
    body { margin: 0; background: #0b1020; color: #e5eefc; }
    header { padding: 18px 24px; background: linear-gradient(120deg,#10243f,#171a35); border-bottom: 1px solid #263653; }
    h1 { margin: 0 0 6px; font-size: 22px; }
    h2 { font-size: 16px; margin: 0 0 12px; color: #9ed0ff; }
    main { padding: 20px 24px; display: grid; gap: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(330px,1fr)); gap: 16px; }
    .card { background: #111a2e; border: 1px solid #243450; border-radius: 12px; padding: 14px 16px; box-shadow: 0 8px 24px #0003; }
    .ok { color: #67e8a5; } .bad { color: #ff8b8b; } .warn { color: #ffd166; }
    button, .button { background: #1d4ed8; color: white; border: 0; border-radius: 8px; padding: 7px 11px; margin: 3px 4px 3px 0; cursor: pointer; text-decoration: none; display: inline-block; font-size: 13px; }
    button.secondary { background: #334155; } button.danger { background: #b91c1c; } button.good { background: #047857; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { border-bottom: 1px solid #243450; padding: 6px 7px; text-align: left; vertical-align: top; }
    th { color: #9ed0ff; position: sticky; top: 0; background: #111a2e; }
    code { color: #bde0fe; word-break: break-all; }
    .matrix { display: grid; grid-template-columns: repeat(auto-fill,minmax(145px,1fr)); gap: 8px; }
    .packet { border: 1px solid #314463; border-radius: 10px; padding: 9px; background: #0d1628; font-size: 12px; }
    .state { display: inline-block; padding: 2px 7px; border-radius: 999px; font-weight: 700; font-size: 11px; }
    .state.committed { background: #064e3b; color: #a7f3d0; }
    .state.failed { background: #7f1d1d; color: #fecaca; }
    .state.quantizing { background: #1e3a8a; color: #bfdbfe; }
    .state.split { background: #713f12; color: #fde68a; }
    .state.pending { background: #334155; color: #e2e8f0; }
    .scroll { max-height: 360px; overflow: auto; border: 1px solid #243450; border-radius: 8px; }
    svg { width: 100%; height: auto; background: #08111f; border-radius: 8px; }
    .muted { color: #91a4c3; font-size: 12px; }
    pre { white-space: pre-wrap; word-break: break-all; background: #08111f; padding: 10px; border-radius: 8px; max-height: 260px; overflow: auto; }
    .kv { display: grid; grid-template-columns: 150px 1fr; gap: 4px 10px; font-size: 13px; }
  </style>
</head>
<body>
<header>
  <h1>触觉反馈跨分支确定性合成内核</h1>
  <div class="muted">固定种子 · 语义重映射 · Q8 定点包络 · SQLite 原子检查点 · 三路径比对 · 独立复核</div>
</header>
<main>
  <section class="card">
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center">
      <div>
        <h2 style="margin-bottom:4px">操作与异常注入</h2>
        <div class="muted">所有样本均在本地生成；诊断服务不访问外部服务。</div>
      </div>
      <div>
        <button onclick="loadState()">刷新</button>
        <button class="good" onclick="postAction('/api/reset')">重置并全部提交</button>
        <button class="danger" onclick="postAction('/api/inject?kind=corrupt')">注入 E_DECODE</button>
        <button class="danger" onclick="postAction('/api/inject?kind=order')">注入 E_ORDER</button>
        <button class="danger" onclick="postAction('/api/inject?kind=flag')">注入 E_FLAG</button>
        <button class="danger" onclick="postAction('/api/inject?kind=stage')">注入 E_STAGE</button>
        <a class="button secondary" href="/api/export?branch=1&download=1">导出分支1</a>
        <a class="button secondary" href="/api/export?branch=2&download=1">导出分支2</a>
        <a class="button secondary" href="/api/export?branch=3&download=1">导出分支3</a>
      </div>
    </div>
    <div id="injection" style="margin-top:12px"></div>
  </section>

  <section class="grid">
    <div class="card"><h2>运行摘要</h2><div id="summary" class="kv"></div></div>
    <div class="card"><h2>三路径与独立复核</h2><div id="paths"></div></div>
  </section>

  <section class="card">
    <h2>包状态矩阵</h2>
    <div id="matrix" class="matrix"></div>
  </section>

  <section class="card">
    <h2>逐通道包络曲线与定点采样点</h2>
    <div id="curves" class="grid"></div>
  </section>

  <section class="grid">
    <div class="card">
      <h2>语义重映射痕迹</h2>
      <div class="scroll"><table id="traces"></table></div>
    </div>
    <div class="card">
      <h2>E_LOSSY 损失清单与导出</h2>
      <div id="losses"></div>
    </div>
  </section>
</main>

<script>
let state = null;

async function postAction(url) {
  const res = await fetch(url, { method: 'POST' });
  state = await res.json();
  render();
}

async function loadState() {
  const res = await fetch('/api/state');
  state = await res.json();
  render();
}

function esc(v) {
  if (v === null || v === undefined) return '';
  if (typeof v === 'object') return JSON.stringify(v);
  return String(v).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function render() {
  if (!state) return;
  renderSummary();
  renderInjection();
  renderPaths();
  renderMatrix();
  renderCurves();
  renderTraces();
  renderLosses();
}

function renderSummary() {
  const cap = state.capability || {};
  const review = state.review || {};
  document.getElementById('summary').innerHTML = `
    <div>语义指纹</div><div><code>${esc(state.fingerprint)}</code></div>
    <div>提交进度</div><div><b>${state.committed}/${state.total}</b> 包</div>
    <div>能力上限</div><div>${esc(cap.max_samples_per_packet)} 点/包，Q=${esc(cap.quantum_level)}，最大 ${esc(cap.max_amplitude_level)}</div>
    <div>并行/缓冲</div><div>${esc(cap.max_workers)} 线程，每线程 ${esc(cap.per_thread_buffer_samples)} 采样点</div>
    <div>独立复核</div><div class="${review.ok ? 'ok' : 'bad'}">${review.ok ? `通过：持久化前缀重算一致（${review.packets}/${state.total}，完整=${review.complete}）` : '失败：' + esc(review.violation && review.violation.item)}</div>`;
}

function renderInjection() {
  const el = document.getElementById('injection');
  const x = state.injection;
  if (!x) { el.innerHTML = '<span class="muted">当前没有注入异常。</span>'; return; }
  el.innerHTML = `<pre class="${x.ok ? 'ok' : 'bad'}">${esc(JSON.stringify(x, null, 2))}</pre>`;
}

function renderPaths() {
  const r = state.report || {};
  const paths = r.paths || [];
  let html = '<table><tr><th>路径</th><th>结果</th><th>包数</th><th>定位</th></tr>';
  for (const p of paths) {
    const loc = p.diff ? `pkg=${p.diff.packet_seq} item=${p.diff.item} sample=${p.diff.sample_offset ?? ''}` : (p.error || '');
    html += `<tr><td>${esc(p.name)}</td><td class="${p.ok ? 'ok' : 'bad'}">${p.ok ? 'MATCH' : 'DIFF'}</td><td>${esc(p.packet_count)}</td><td><code>${esc(loc)}</code></td></tr>`;
  }
  html += '</table>';
  html += `<p>跨分支检查：${(r.cross_branch||[]).map(x => `B${x.branch}:<span class="${x.ok?'ok':'bad'}">${x.ok?'同帧':'差异'}</span>`).join('，')}</p>`;
  html += `<p>独立复核：<span class="${r.independent_review_ok?'ok':'bad'}">${r.independent_review_ok ? 'PASS' : 'FAIL'}</span></p>`;
  document.getElementById('paths').innerHTML = html;
}

function renderMatrix() {
  const el = document.getElementById('matrix');
  el.innerHTML = '';
  const packets = state.packets || [];
  for (const m of state.matrix || []) {
    const p = packets.find(x => x.global_seq === m.seq) || {};
    const btn = m.state === 'failed' ? `<button class="good" onclick="postAction('/api/retry?seq=${m.seq}')">逐包重试</button>` : '';
    const err = m.last_error ? `<div class="bad">${esc(m.last_error.code)} ${esc(m.last_error.message)}</div>` : '';
    el.innerHTML += `<div class="packet">
      <b>#${m.seq} ${esc(m.channel)}</b><br/>
      [${esc(p.start_sample)}:${esc(p.end_sample)}] points=${esc(p.sample_count)} events=${esc(p.event_count)}<br/>
      <span class="state ${esc(m.state)}">${esc(m.state)}</span> attempts=${esc(m.attempts)}
      ${btn}${err}
    </div>`;
  }
}

function channelFrames(ch) {
  const byIndex = new Map();
  for (const p of state.packets || []) {
    if (p.channel !== ch) continue;
    for (const f of p.frames || []) byIndex.set(f.sample_index, f);
  }
  return [...byIndex.values()].sort((a,b) => a.sample_index-b.sample_index);
}

function renderCurves() {
  const cap = state.capability || {};
  const channels = cap.channels || ['ch_left','ch_right'];
  const maxQ = (cap.max_amplitude_level || 120) * 256;
  const W = 680, H = 210, pad = 28;
  let html = '';
  for (const ch of channels) {
    const frames = channelFrames(ch);
    const maxIdx = Math.max(...frames.map(f => f.sample_index), 1);
    const x = i => pad + i / maxIdx * (W - pad*2);
    const y = q => H - pad - Math.max(0, Math.min(maxQ, q)) / maxQ * (H - pad*2);
    const pts = frames.map(f => `${x(f.sample_index).toFixed(1)},${y(f.frame_q8).toFixed(1)}`).join(' ');
    const circles = frames.map(f => `<circle cx="${x(f.sample_index)}" cy="${y(f.frame_q8)}" r="3.2" fill="#67e8f9"><title>sample=${f.sample_index} q8=${f.frame_q8} level=${f.level}</title></circle>`).join('');
    const bounds = (state.packets||[]).filter(p=>p.channel===ch).map(p=>`<line x1="${x(p.start_sample)}" x2="${x(p.start_sample)}" y1="${pad-8}" y2="${H-pad}" stroke="#334155" stroke-dasharray="4 4"/>`).join('');
    const labels = frames.filter((_,i)=>i%2===0).map(f=>`<text x="${x(f.sample_index)}" y="${H-8}" fill="#91a4c3" font-size="10" text-anchor="middle">${f.sample_index}</text>`).join('');
    html += `<div class="card" style="padding:8px"><h2>${esc(ch)}</h2>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(ch)} envelope">
        <line x1="${pad}" x2="${W-pad}" y1="${H-pad}" y2="${H-pad}" stroke="#40536f"/>
        <line x1="${pad}" x2="${pad}" y1="${pad-8}" y2="${H-pad}" stroke="#40536f"/>
        ${bounds}<polyline points="${pts}" fill="none" stroke="#60a5fa" stroke-width="2.5"/>${circles}${labels}
      </svg>
      <div class="muted">悬停圆点查看 Q8/level；虚线为包边界。</div>
    </div>`;
  }
  document.getElementById('curves').innerHTML = html;
}

function renderTraces() {
  let html = '<tr><th>帧</th><th>内部语义</th><th>源路径</th><th>原始值</th><th>内部值</th><th>换算规则</th></tr>';
  for (const t of state.traces || []) {
    html += `<tr><td>${esc(t.frame_no)}</td><td><code>${esc(t.internal_name)}</code></td><td><code>${esc(t.source_path)}</code></td><td>${esc(t.raw_value)}</td><td>${esc(t.converted_value)}</td><td>${esc(t.rule)}</td></tr>`;
  }
  document.getElementById('traces').innerHTML = html;
}

function renderLosses() {
  const losses = state.losses || {};
  let rows = [];
  for (const [branch, items] of Object.entries(losses)) {
    for (const item of items || []) rows.push(item);
  }
  let html = `<p class="warn">生成器的设计批注在所有发行分支均不可表达，导出时记录 ${rows.length} 条 E_LOSSY。</p>`;
  html += '<div class="scroll"><table><tr><th>分支</th><th>路径</th><th>语义</th><th>原值</th><th>处置</th></tr>';
  for (const x of rows) html += `<tr><td>${esc(x.branch)}</td><td><code>${esc(x.path)}</code></td><td>${esc(x.internal_name)}</td><td>${esc(x.original)}</td><td>${esc(x.disposition)}</td></tr>`;
  html += '</table></div>';
  html += '<p class="muted">上方“导出分支”会下载当前导入模型；若构造 priority&gt;9 等越界字段，导出结果会追加 clamp/omit 损失项。</p>';
  document.getElementById('losses').innerHTML = html;
}

loadState();
setInterval(loadState, 3000);
</script>
</body>
</html>
